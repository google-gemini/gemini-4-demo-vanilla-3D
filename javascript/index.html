        colData[i * 4 + 1] = cat.bookColor[i * 3 + 1];
        colData[i * 4 + 2] = cat.bookColor[i * 3 + 2];
        colData[i * 4 + 3] = cat.bookRough[i];

        bandData[i * 4] = cat.bookBandCol[i * 3];
        bandData[i * 4 + 1] = cat.bookBandCol[i * 3 + 1];
        bandData[i * 4 + 2] = cat.bookBandCol[i * 3 + 2];
        bandData[i * 4 + 3] = cat.bookBandY0[i];

        band2Data[i] = cat.bookBandY1[i];
      }

      function uploadCatalogTex(internalFmt, fmt, arr) {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texStorage2D(gl.TEXTURE_2D, 1, internalFmt, cat.nBins, cat.nTiers);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, cat.nBins, cat.nTiers, fmt, gl.FLOAT, arr);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return t;
      }

      const bookMetaTex = uploadCatalogTex(gl.RGBA32F, gl.RGBA, metaData);
      const bookColTex = uploadCatalogTex(gl.RGBA32F, gl.RGBA, colData);
      const bookBandTex = uploadCatalogTex(gl.RGBA32F, gl.RGBA, bandData);
      const bookBand2Tex = uploadCatalogTex(gl.R32F, gl.RED, band2Data);

      // 3. Pre-allocate all multi-pass float textures & FBOs once at GL_MAX_W x GL_MAX_H
      const texHdrA = createFloatTex2D(gl, GL_MAX_W, GL_MAX_H, gl.RGBA32F);
      const texHdrB = createFloatTex2D(gl, GL_MAX_W, GL_MAX_H, gl.RGBA32F);
      const texPosMat = createFloatTex2D(gl, GL_MAX_W, GL_MAX_H, gl.RGBA32F);
      const texNormRough = createFloatTex2D(gl, GL_MAX_W, GL_MAX_H, gl.RGBA16F);
      const texReflSharp = createFloatTex2D(gl, GL_MAX_W, GL_MAX_H, gl.RGBA16F);
      const texTempA = createFloatTex2D(gl, GL_MAX_W, GL_MAX_H, gl.RGBA16F);
      const texTempB = createFloatTex2D(gl, GL_MAX_W, GL_MAX_H, gl.RGBA16F);
      const texLobe1 = createFloatTex2D(gl, GL_MAX_W, GL_MAX_H, gl.RGBA16F);

      const halfW = GL_MAX_W >> 1, halfH = GL_MAX_H >> 1;
      const texSubA = createFloatTex2D(gl, halfW, halfH, gl.RGBA16F);
      const texSubB = createFloatTex2D(gl, halfW, halfH, gl.RGBA16F);
      const texLobe2Sub = createFloatTex2D(gl, halfW, halfH, gl.RGBA16F);

      const quarterW = GL_MAX_W >> 2, quarterH = GL_MAX_H >> 2;
      const texQuarterA = createFloatTex2D(gl, quarterW, quarterH, gl.RGBA16F);
      const texQuarterB = createFloatTex2D(gl, quarterW, quarterH, gl.RGBA16F);

      const fboPrimary = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fboPrimary);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texHdrA, 0);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, texPosMat, 0);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, texNormRough, 0);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
        throw new Error("Incomplete primary MRT FBO");
      }

      const fboHdrA = createSingleFbo(gl, texHdrA);
      const fboHdrB = createSingleFbo(gl, texHdrB);
      const fboReflSharp = createSingleFbo(gl, texReflSharp);
      const fboTempA = createSingleFbo(gl, texTempA);
      const fboTempB = createSingleFbo(gl, texTempB);
      const fboLobe1 = createSingleFbo(gl, texLobe1);
      const fboSubA = createSingleFbo(gl, texSubA);
      const fboSubB = createSingleFbo(gl, texSubB);
      const fboLobe2Sub = createSingleFbo(gl, texLobe2Sub);
      const fboQuarterA = createSingleFbo(gl, texQuarterA);
      const fboQuarterB = createSingleFbo(gl, texQuarterB);

      // 4. Compile & link all GLSL ES 3.00 passes
      const progPrimary = createGlProgram(gl, VS_FULLSCREEN, FS_PRIMARY, "Primary");
      const progGlass = createGlProgram(gl, VS_FULLSCREEN, FS_GLASS, "Glass");
      const progFloorRefl = createGlProgram(gl, VS_FULLSCREEN, FS_FLOOR_REFL, "FloorRefl");
      const progBlur = createGlProgram(gl, VS_FULLSCREEN, FS_BLUR, "Blur");
      const progDownsample = createGlProgram(gl, VS_FULLSCREEN, FS_DOWNSAMPLE2X, "Downsample2x");
      const progFloorCombine = createGlProgram(gl, VS_FULLSCREEN, FS_FLOOR_COMBINE, "FloorCombine");
      const progEdgeSSAA = createGlProgram(gl, VS_FULLSCREEN, FS_EDGE_SSAA, "EdgeSSAA");
      const progVolSub = createGlProgram(gl, VS_FULLSCREEN, FS_VOL_SUB, "VolSub");
      const progVolUpsampleMote = createGlProgram(gl, VS_FULLSCREEN, FS_VOL_UPSAMPLE_AND_MOTE, "VolUpsampleMote");
      const progVolCombine = createGlProgram(gl, VS_FULLSCREEN, FS_VOL_COMBINE, "VolCombine");
      const progTonemap = createGlProgram(gl, VS_FULLSCREEN, FS_TONEMAP, "Tonemap");
      const progFinalScreen = createGlProgram(gl, VS_FULLSCREEN, FS_FINAL_SCREEN, "FinalScreen");

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      window.__webgl2Active = true;
      window.__sunlitRendererMode = "webgl2";
      window.__gpuReallocCount = 0;

      return {
        gl,
        vao,
        randTex,
        bookMetaTex,
        bookColTex,
        bookBandTex,
        bookBand2Tex,
        texHdrA, texHdrB, texPosMat, texNormRough, texReflSharp,
        texTempA, texTempB, texLobe1,
        texSubA, texSubB, texLobe2Sub,
        texQuarterA, texQuarterB,
        fboPrimary, fboHdrA, fboHdrB, fboReflSharp,
        fboTempA, fboTempB, fboLobe1,
        fboSubA, fboSubB, fboLobe2Sub,
        fboQuarterA, fboQuarterB,
        progPrimary, progGlass, progFloorRefl, progBlur, progDownsample,
        progFloorCombine, progEdgeSSAA, progVolSub,
        progVolUpsampleMote, progVolCombine, progTonemap, progFinalScreen,
        uniformCache: new Map()
      };
    } catch (err) {
      console.warn("WebGL2 HDR ray-tracer unavailable, falling back to CPU:", err);
      window.__webgl2Active = false;
      window.__sunlitRendererMode = "cpu";
      return null;
    }
  }

  function uLoc(eng, prog, name) {
    let pMap = eng.uniformCache.get(prog);
    if (!pMap) {
      pMap = new Map();
      eng.uniformCache.set(prog, pMap);
    }
    if (pMap.has(name)) return pMap.get(name);
    const loc = eng.gl.getUniformLocation(prog, name);
    pMap.set(name, loc);
    return loc;
  }

  function bindSceneUniforms(eng, prog, bufW, bufH, resScale) {
    const gl = eng.gl;
    gl.useProgram(prog);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, eng.randTex);
    gl.uniform1i(uLoc(eng, prog, "u_randTex"), 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, eng.bookMetaTex);
    gl.uniform1i(uLoc(eng, prog, "u_bookMetaTex"), 1);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, eng.bookColTex);
    gl.uniform1i(uLoc(eng, prog, "u_bookColTex"), 2);

    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, eng.bookBandTex);
    gl.uniform1i(uLoc(eng, prog, "u_bookBandTex"), 3);

    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, eng.bookBand2Tex);
    gl.uniform1i(uLoc(eng, prog, "u_bookBand2Tex"), 4);

    gl.uniform2f(uLoc(eng, prog, "u_res"), bufW, bufH);
    gl.uniform1f(uLoc(eng, prog, "u_resScale"), resScale);
    gl.uniform3f(uLoc(eng, prog, "u_camPos"), CAM_POS[0], CAM_POS[1], CAM_POS[2]);
    gl.uniform1f(uLoc(eng, prog, "u_camYawRad"), CAM_YAW_RAD);
    gl.uniform1f(uLoc(eng, prog, "u_camFovScale"), CAM_FOV_SCALE);
    gl.uniform1f(uLoc(eng, prog, "u_camVShift"), CAM_V_SHIFT);

    gl.uniform1f(uLoc(eng, prog, "u_roomXLeft"), ROOM_X_LEFT);
    gl.uniform1f(uLoc(eng, prog, "u_roomXRight"), ROOM_X_RIGHT);
    gl.uniform1f(uLoc(eng, prog, "u_roomYFloor"), ROOM_Y_FLOOR);
    gl.uniform1f(uLoc(eng, prog, "u_roomYCeil"), ROOM_Y_CEIL);
    gl.uniform1f(uLoc(eng, prog, "u_roomZBack"), ROOM_Z_BACK);
    gl.uniform1f(uLoc(eng, prog, "u_backConcreteXMax"), BACK_CONCRETE_X_MAX);
    gl.uniform1f(uLoc(eng, prog, "u_windowTopY"), WINDOW_TOP_Y);
    gl.uniform1f(uLoc(eng, prog, "u_leftWallShiftX"), LEFT_WALL_SHIFT_X);
    gl.uniform1f(uLoc(eng, prog, "u_concretePanelW"), CONCRETE_PANEL_W);

    gl.uniform3f(uLoc(eng, prog, "u_sunDir"), SUN_DIR[0], SUN_DIR[1], SUN_DIR[2]);
    gl.uniform3f(uLoc(eng, prog, "u_sunRadiance"), SUN_RADIANCE[0], SUN_RADIANCE[1], SUN_RADIANCE[2]);
    gl.uniform3f(uLoc(eng, prog, "u_skyZenithRad"), SKY_ZENITH_RAD[0], SKY_ZENITH_RAD[1], SKY_ZENITH_RAD[2]);
    gl.uniform4f(uLoc(eng, prog, "u_sunHorizPerp"), SUN_HORIZ_X, SUN_HORIZ_Z, SUN_PERP_X, SUN_PERP_Z);

    gl.uniform3f(uLoc(eng, prog, "u_sconcePos"), SCONCE_POS[0], SCONCE_POS[1], SCONCE_POS[2]);
    gl.uniform3f(uLoc(eng, prog, "u_sconceRadiance"), SCONCE_RADIANCE[0], SCONCE_RADIANCE[1], SCONCE_RADIANCE[2]);
    gl.uniform3f(uLoc(eng, prog, "u_sconceBulbEmit"), SCONCE_BULB_EMIT[0], SCONCE_BULB_EMIT[1], SCONCE_BULB_EMIT[2]);

    gl.uniform1f(uLoc(eng, prog, "u_mountainParallaxPhi"), MOUNTAIN_PARALLAX_PHI);
    gl.uniform1f(uLoc(eng, prog, "u_duskFactor"), DUSK_FACTOR);
    gl.uniform1f(uLoc(eng, prog, "u_highSunFactor"), HIGH_SUN_FACTOR);

    gl.uniform4f(uLoc(eng, prog, "u_tableParams"), TABLE_SHIFT_X, TABLE_SHIFT_Z, TABLE_TOP_EX, TABLE_PLINTH_EX);
    gl.uniform1f(uLoc(eng, prog, "u_tableApronEx"), TABLE_APRON_EX);
    gl.uniform4f(uLoc(eng, prog, "u_bookCarafePos"), BOOK_CX, BOOK_CZ, CARAFE_CX, CARAFE_CZ);
    gl.uniform2f(uLoc(eng, prog, "u_tumblerPos"), TUMBLER_CX, TUMBLER_CZ);
    gl.uniform2f(uLoc(eng, prog, "u_rugX"), RUG_MIN_X, RUG_MAX_X);
    gl.uniform4f(uLoc(eng, prog, "u_benchParams"), BENCH_CX, BENCH_EX, BENCH_LEG_X0, BENCH_LEG_X1);
    gl.uniform1f(uLoc(eng, prog, "u_benchVesselX"), BENCH_VESSEL_X);

    gl.uniform3f(uLoc(eng, prog, "u_chairBase"), CHAIR_BASE[0], CHAIR_BASE[1], CHAIR_BASE[2]);
    gl.uniform3f(uLoc(eng, prog, "u_chairSeatC"), CHAIR_SEAT_C[0], CHAIR_SEAT_C[1], CHAIR_SEAT_C[2]);
    gl.uniform3f(uLoc(eng, prog, "u_chairBackC"), CHAIR_BACK_C[0], CHAIR_BACK_C[1], CHAIR_BACK_C[2]);
    gl.uniform3f(uLoc(eng, prog, "u_chairBolP0"), CHAIR_BOL_P0[0], CHAIR_BOL_P0[1], CHAIR_BOL_P0[2]);
    gl.uniform3f(uLoc(eng, prog, "u_chairBolP1"), CHAIR_BOL_P1[0], CHAIR_BOL_P1[1], CHAIR_BOL_P1[2]);
    gl.uniform3f(uLoc(eng, prog, "u_chairRot"), CHAIR_YAW, CHAIR_COS_YAW, CHAIR_SIN_YAW);

    for (let i = 0; i < 8; i++) {
      const sA = CHAIR_STEEL_SEGS[i][0];
      const sB = CHAIR_STEEL_SEGS[i][1];
      gl.uniform3f(uLoc(eng, prog, `u_chairSteelA[${i}]`), sA[0], sA[1], sA[2]);
      gl.uniform3f(uLoc(eng, prog, `u_chairSteelB[${i}]`), sB[0], sB[1], sB[2]);
    }

    gl.uniform4f(
      uLoc(eng, prog, "u_rightTransomY"),
      RIGHT_TRANSOM_Y[0],
      RIGHT_TRANSOM_Y[1],
      RIGHT_TRANSOM_Y[2],
      RIGHT_TRANSOM_Y[3]
    );
    gl.uniform1f(uLoc(eng, prog, "u_rightTransomY4"), RIGHT_TRANSOM_Y.length > 4 ? RIGHT_TRANSOM_Y[4] : 99.0);
    gl.uniform1i(uLoc(eng, prog, "u_numRightTransoms"), RIGHT_TRANSOM_Y.length);

    gl.uniform4f(
      uLoc(eng, prog, "u_backMullionX"),
      BACK_MULLION_X[0] || 99.0,
      BACK_MULLION_X[1] || 99.0,
      BACK_MULLION_X[2] || 99.0,
      BACK_MULLION_X.length > 3 ? BACK_MULLION_X[3] : 99.0
    );
    gl.uniform1i(uLoc(eng, prog, "u_numBackMullions"), BACK_MULLION_X.length);

    const vessels = MASTER_CATALOG.vessels;
    for (let v = 0; v < 5; v++) {
      const vo = vessels[v];
      gl.uniform4f(uLoc(eng, prog, `u_vesselPosR0[${v}]`), vo.cx, vo.cy, vo.cz, vo.rx);
      gl.uniform3f(uLoc(eng, prog, `u_vesselRyRzRough[${v}]`), vo.ry, vo.rz, vo.rough);
      gl.uniform3f(uLoc(eng, prog, `u_vesselCol[${v}]`), vo.color[0], vo.color[1], vo.color[2]);
    }
  }

  function runBlurPass(eng, srcTex, dstFbo, w, h, dx, dy, halfRadius, sigma) {
    const gl = eng.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, dstFbo);
    gl.viewport(0, 0, w, h);
    gl.useProgram(eng.progBlur);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform1i(uLoc(eng, eng.progBlur, "u_srcTex"), 0);
    gl.uniform2i(uLoc(eng, eng.progBlur, "u_srcSize"), w, h);
    gl.uniform2i(uLoc(eng, eng.progBlur, "u_dir"), dx, dy);
    gl.uniform1i(uLoc(eng, eng.progBlur, "u_halfRadius"), halfRadius);
    gl.uniform1f(uLoc(eng, eng.progBlur, "u_sigma"), sigma);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function renderWebGL2Frame(eng, bufW, bufH) {
    const gl = eng.gl;
    const w = Math.min(bufW, GL_MAX_W);
    const h = Math.min(bufH, GL_MAX_H);
    const resScale = Math.min(1.0, Math.max(0.25, h / 1200.0));

    gl.bindVertexArray(eng.vao);

    // Pass 1A: Primary Ray-Tracing + Direct/Indirect Radiosity into MRT
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboPrimary);
    gl.viewport(0, 0, w, h);
    bindSceneUniforms(eng, eng.progPrimary, w, h, resScale);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Pass 1B: Dielectric Glass Vessel Reflection & Refraction (only executes on carafe/tumbler pixels)
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboHdrB);
    gl.viewport(0, 0, w, h);
    bindSceneUniforms(eng, eng.progGlass, w, h, resScale);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, eng.texHdrA);
    gl.uniform1i(uLoc(eng, eng.progGlass, "u_hdrTex"), 5);
    gl.activeTexture(gl.TEXTURE6);
    gl.bindTexture(gl.TEXTURE_2D, eng.texPosMat);
    gl.uniform1i(uLoc(eng, eng.progGlass, "u_posMatTex"), 6);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D, eng.texNormRough);
    gl.uniform1i(uLoc(eng, eng.progGlass, "u_normRoughTex"), 7);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, eng.fboHdrB);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, eng.fboHdrA);
    gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.NEAREST);

    // Pass 2A: Secondary Floor Reflections
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboReflSharp);
    gl.viewport(0, 0, w, h);
    bindSceneUniforms(eng, eng.progFloorRefl, w, h, resScale);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, eng.texHdrA);
    gl.uniform1i(uLoc(eng, eng.progFloorRefl, "u_hdrTex"), 5);
    gl.activeTexture(gl.TEXTURE6);
    gl.bindTexture(gl.TEXTURE_2D, eng.texPosMat);
    gl.uniform1i(uLoc(eng, eng.progFloorRefl, "u_posMatTex"), 6);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D, eng.texNormRough);
    gl.uniform1i(uLoc(eng, eng.progFloorRefl, "u_normRoughTex"), 7);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Pass 2B: Anisotropic GGX Floor Reflection Lobes (lobe1 + half-res lobe2Sub)
    const lobe1Half = Math.max(4, Math.round(18 * resScale));
    const lobe1Sigma = 7.5 * resScale;
    const lobe1IsoSigma = 2.2 * resScale;
    const lobe1IsoHalf = Math.max(1, Math.ceil(lobe1IsoSigma * 2.6));
    runBlurPass(eng, eng.texReflSharp, eng.fboTempA, w, h, 0, 1, lobe1Half, lobe1Sigma);
    runBlurPass(eng, eng.texTempA, eng.fboTempB, w, h, 0, 1, lobe1IsoHalf, lobe1IsoSigma);
    runBlurPass(eng, eng.texTempB, eng.fboLobe1, w, h, 1, 0, lobe1IsoHalf, lobe1IsoSigma);

    const subW = Math.max(2, w >> 1);
    const subH = Math.max(2, h >> 1);
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboSubA);
    gl.viewport(0, 0, subW, subH);
    gl.useProgram(eng.progDownsample);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, eng.texReflSharp);
    gl.uniform1i(uLoc(eng, eng.progDownsample, "u_srcTex"), 0);
    gl.uniform2i(uLoc(eng, eng.progDownsample, "u_srcSize"), w, h);
    gl.uniform1i(uLoc(eng, eng.progDownsample, "u_bloomMode"), 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const lobe2Half = Math.max(5, Math.round(22 * resScale));
    const lobe2VertSigma = 11.0 * resScale;
    const lobe2IsoSigma = 2.4 * resScale;
    const lobe2IsoHalf = Math.max(1, Math.ceil(lobe2IsoSigma * 2.6));
    runBlurPass(eng, eng.texSubA, eng.fboSubB, subW, subH, 0, 1, lobe2Half, lobe2VertSigma);
    runBlurPass(eng, eng.texSubB, eng.fboSubA, subW, subH, 0, 1, lobe2IsoHalf, lobe2IsoSigma);
    runBlurPass(eng, eng.texSubA, eng.fboLobe2Sub, subW, subH, 1, 0, lobe2IsoHalf, lobe2IsoSigma);

    // Pass 2C: Blend Floor Reflection Lobes into HDR Radiance (texHdrB)
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboHdrB);
    gl.viewport(0, 0, w, h);
    bindSceneUniforms(eng, eng.progFloorCombine, w, h, resScale);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, eng.texHdrA);
    gl.uniform1i(uLoc(eng, eng.progFloorCombine, "u_hdrTex"), 5);
    gl.activeTexture(gl.TEXTURE6);
    gl.bindTexture(gl.TEXTURE_2D, eng.texPosMat);
    gl.uniform1i(uLoc(eng, eng.progFloorCombine, "u_posMatTex"), 6);
    gl.activeTexture(gl.TEXTURE7);
    gl.bindTexture(gl.TEXTURE_2D, eng.texNormRough);
    gl.uniform1i(uLoc(eng, eng.progFloorCombine, "u_normRoughTex"), 7);
    gl.activeTexture(gl.TEXTURE8);
    gl.bindTexture(gl.TEXTURE_2D, eng.texReflSharp);
    gl.uniform1i(uLoc(eng, eng.progFloorCombine, "u_sharpTex"), 8);
    gl.activeTexture(gl.TEXTURE9);
    gl.bindTexture(gl.TEXTURE_2D, eng.texLobe1);
    gl.uniform1i(uLoc(eng, eng.progFloorCombine, "u_lobe1Tex"), 9);
    gl.activeTexture(gl.TEXTURE10);
    gl.bindTexture(gl.TEXTURE_2D, eng.texLobe2Sub);
    gl.uniform1i(uLoc(eng, eng.progFloorCombine, "u_lobe2SubTex"), 10);
    gl.uniform2i(uLoc(eng, eng.progFloorCombine, "u_subSize"), subW, subH);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Pass 3: Selective 3-Tap Rotated-Grid Silhouette Supersampling (texHdrB -> texHdrA)
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboHdrA);
    gl.viewport(0, 0, w, h);
    bindSceneUniforms(eng, eng.progEdgeSSAA, w, h, resScale);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, eng.texHdrB);
    gl.uniform1i(uLoc(eng, eng.progEdgeSSAA, "u_hdrTex"), 5);
    gl.activeTexture(gl.TEXTURE6);
    gl.bindTexture(gl.TEXTURE_2D, eng.texPosMat);
    gl.uniform1i(uLoc(eng, eng.progEdgeSSAA, "u_posMatTex"), 6);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Pass 4: Quarter-Res Volumetric Tyndall Sunbeams & Airborne Dust Motes
    const volW = Math.max(2, w >> 2);
    const volH = Math.max(2, h >> 2);
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboQuarterA);
    gl.viewport(0, 0, volW, volH);
    bindSceneUniforms(eng, eng.progVolSub, w, h, resScale);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, eng.texHdrA);
    gl.uniform1i(uLoc(eng, eng.progVolSub, "u_hdrTex"), 5);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboTempA);
    gl.viewport(0, 0, w, h);
    bindSceneUniforms(eng, eng.progVolUpsampleMote, w, h, resScale);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, eng.texQuarterA);
    gl.uniform1i(uLoc(eng, eng.progVolUpsampleMote, "u_volSubTex"), 5);
    gl.uniform2i(uLoc(eng, eng.progVolUpsampleMote, "u_volSize"), volW, volH);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const volBlurSigma = 1.8 * resScale;
    const volBlurHalf = Math.max(1, Math.ceil(volBlurSigma * 2.6));
    runBlurPass(eng, eng.texTempA, eng.fboTempB, w, h, 0, 1, volBlurHalf, volBlurSigma);
    runBlurPass(eng, eng.texTempB, eng.fboLobe1, w, h, 1, 0, volBlurHalf, volBlurSigma);

    const moteSigma = 1.0 * resScale;
    const moteHalf = Math.max(1, Math.ceil(moteSigma * 2.6));
    runBlurPass(eng, eng.texTempA, eng.fboTempB, w, h, 0, 1, moteHalf, moteSigma);
    runBlurPass(eng, eng.texTempB, eng.fboReflSharp, w, h, 1, 0, moteHalf, moteSigma);

    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboHdrB);
    gl.viewport(0, 0, w, h);
    gl.useProgram(eng.progVolCombine);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, eng.texHdrA);
    gl.uniform1i(uLoc(eng, eng.progVolCombine, "u_hdrTex"), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, eng.texLobe1);
    gl.uniform1i(uLoc(eng, eng.progVolCombine, "u_volBlurTex"), 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, eng.texReflSharp);
    gl.uniform1i(uLoc(eng, eng.progVolCombine, "u_moteBlurTex"), 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Pass 5: Dual-Lobe Bloom, Tilt-Shift Vignette, ACES Filmic & Lateral CA + Portra 160 Grain
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboSubA);
    gl.viewport(0, 0, subW, subH);
    gl.useProgram(eng.progDownsample);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, eng.texHdrB);
    gl.uniform1i(uLoc(eng, eng.progDownsample, "u_srcTex"), 0);
    gl.uniform2i(uLoc(eng, eng.progDownsample, "u_srcSize"), w, h);
    gl.uniform1i(uLoc(eng, eng.progDownsample, "u_bloomMode"), 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const bTightSigma = 1.8 * resScale;
    const bTightHalf = Math.max(1, Math.ceil(bTightSigma * 2.6));
    runBlurPass(eng, eng.texSubA, eng.fboSubB, subW, subH, 0, 1, bTightHalf, bTightSigma);
    runBlurPass(eng, eng.texSubB, eng.fboLobe2Sub, subW, subH, 1, 0, bTightHalf, bTightSigma);

    const hSub4W = Math.max(2, w >> 2);
    const hSub4H = Math.max(2, h >> 2);
    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboQuarterA);
    gl.viewport(0, 0, hSub4W, hSub4H);
    gl.useProgram(eng.progDownsample);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, eng.texSubA);
    gl.uniform1i(uLoc(eng, eng.progDownsample, "u_srcTex"), 0);
    gl.uniform2i(uLoc(eng, eng.progDownsample, "u_srcSize"), subW, subH);
    gl.uniform1i(uLoc(eng, eng.progDownsample, "u_bloomMode"), 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const bWideSigma = 3.5 * resScale;
    const bWideHalf = Math.max(1, Math.ceil(bWideSigma * 2.6));
    runBlurPass(eng, eng.texQuarterA, eng.fboQuarterB, hSub4W, hSub4H, 0, 1, bWideHalf, bWideSigma);
    runBlurPass(eng, eng.texQuarterB, eng.fboQuarterA, hSub4W, hSub4H, 1, 0, bWideHalf, bWideSigma);

    gl.bindFramebuffer(gl.FRAMEBUFFER, eng.fboTempA);
    gl.viewport(0, 0, w, h);
    gl.useProgram(eng.progTonemap);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, eng.texHdrB);
    gl.uniform1i(uLoc(eng, eng.progTonemap, "u_hdrTex"), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, eng.texLobe2Sub);
    gl.uniform1i(uLoc(eng, eng.progTonemap, "u_bTightTex"), 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, eng.texQuarterA);
    gl.uniform1i(uLoc(eng, eng.progTonemap, "u_bWideTex"), 2);
    gl.uniform2f(uLoc(eng, eng.progTonemap, "u_res"), w, h);
    gl.uniform1f(uLoc(eng, eng.progTonemap, "u_camVShift"), CAM_V_SHIFT);
    gl.uniform2i(uLoc(eng, eng.progTonemap, "u_hSub2Size"), subW, subH);
    gl.uniform2i(uLoc(eng, eng.progTonemap, "u_hSub4Size"), hSub4W, hSub4H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Final Screen Output (with top-down to bottom-up vertical coordinate flip)
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.useProgram(eng.progFinalScreen);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, eng.texTempA);
    gl.uniform1i(uLoc(eng, eng.progFinalScreen, "u_srgbTex"), 0);
    gl.uniform2f(uLoc(eng, eng.progFinalScreen, "u_res"), w, h);
    gl.uniform1f(uLoc(eng, eng.progFinalScreen, "u_resScale"), resScale);
    gl.uniform1f(uLoc(eng, eng.progFinalScreen, "u_camVShift"), CAM_V_SHIFT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  const GEO_BUCKETS = [
    [1800, 900],
    [1200, 900],
    [1080, 1080],
    [900, 1200],
    [720, 1280]
  ];

  function getGeoBucketIndex(viewW, viewH) {
    const ar = viewW / Math.max(1, viewH);
    if (ar >= 1.65) return 0;
    if (ar >= 1.18) return 1;
    if (ar >= 0.88) return 2;
    if (ar >= 0.68) return 3;
    return 4;
  }

  const GEO_CACHE = GEO_BUCKETS.map(([bw, bh]) => {
    computeResponsiveSceneState(bw, bh);
    return {
      bw,
      bh,
      LEFT_WALL_SHIFT_X,
      ROOM_X_LEFT,
      ROOM_X_RIGHT,
      ROOM_Y_FLOOR,
      ROOM_Y_CEIL,
      ROOM_Z_BACK,
      BACK_CONCRETE_X_MAX,
      CONCRETE_PANEL_W,
      WINDOW_TOP_Y,
      RIGHT_TRANSOM_Y: RIGHT_TRANSOM_Y.slice(),
      BACK_MULLION_X: BACK_MULLION_X.slice(),
      BENCH_CX,
      BENCH_EX,
      BENCH_LEG_X0,
      BENCH_LEG_X1,
      BENCH_VESSEL_X,
      SCONCE_POS: SCONCE_POS.slice(),
      CHAIR_BASE: CHAIR_BASE.slice(),
      CHAIR_YAW,
      CHAIR_COS_YAW,
      CHAIR_SIN_YAW,
      CHAIR_SEAT_C: CHAIR_SEAT_C.slice(),
      CHAIR_BACK_C: CHAIR_BACK_C.slice(),
      CHAIR_BOL_P0: CHAIR_BOL_P0.slice(),
      CHAIR_BOL_P1: CHAIR_BOL_P1.slice(),
      CHAIR_STEEL_SEGS: CHAIR_STEEL_SEGS.map(seg => [seg[0].slice(), seg[1].slice()]),
      TABLE_SHIFT_X,
      TABLE_SHIFT_Z,
      TABLE_TOP_EX,
      TABLE_PLINTH_EX,
      TABLE_APRON_EX,
      BOOK_CX,
      BOOK_CZ,
      CARAFE_CX,
      CARAFE_CZ,
      TUMBLER_CX,
      TUMBLER_CZ,
      RUG_MIN_X,
      RUG_MAX_X,
      CAM_POS: CAM_POS.slice(),
      CAM_YAW_RAD,
      CAM_V_SHIFT
    };
  });

  function applyCachedSceneAndLighting(cssW, cssH) {
    const idx = getGeoBucketIndex(cssW, cssH);
    const b = GEO_CACHE[idx];
    const aspect = cssW / Math.max(1, cssH);
    const narrowFactor = 1.0 - smoothstep(0.56, 1.35, aspect);

    const solarW = cssW * 1.42;
    const solarH = cssH * 1.78;
    computeResponsiveSceneState(solarW, solarH);

    // Viewport Width (cssW) -> Solar Azimuth Angle & Exterior Mountain Parallax
    const wNorm = clamp((solarW - 1590.0) / 560.0, -1.35, 1.35);
    const baseAzimuthRad = Math.atan2(0.585, 0.755);
    const azScale = 1.0 - 0.55 * narrowFactor;
    const sunAzimuthRad = baseAzimuthRad + (14.5 * wNorm * azScale * PI) / 180.0;
    MOUNTAIN_PARALLAX_PHI = wNorm * 0.16;

    // Viewport Height (cssH) -> Solar Elevation, Alpenglow Sky & 2700K Brass Sconce Radiosity
    DUSK_FACTOR = 1.0 - smoothstep(520.0, 960.0, solarH);
    HIGH_SUN_FACTOR = smoothstep(1060.0, 1500.0, solarH);

    const baseElevRad = Math.asin(0.295 / sunLenInit);
    const sunElevRad = clamp(
      baseElevRad - (9.2 * DUSK_FACTOR * PI) / 180.0 + (5.2 * HIGH_SUN_FACTOR * PI) / 180.0,
      (6.5 * PI) / 180.0,
      (28.0 * PI) / 180.0
    );

    const cosElev = Math.cos(sunElevRad);
    SUN_DIR[0] = cosElev * Math.cos(sunAzimuthRad);
    SUN_DIR[1] = Math.sin(sunElevRad);
    SUN_DIR[2] = cosElev * Math.sin(sunAzimuthRad);
    const sLen = Math.hypot(SUN_DIR[0], SUN_DIR[1], SUN_DIR[2]) || 1.0;
    SUN_DIR[0] /= sLen;
    SUN_DIR[1] /= sLen;
    SUN_DIR[2] /= sLen;

    SUN_HORIZ_LEN = Math.hypot(SUN_DIR[0], SUN_DIR[2]) || 1.0;
    SUN_HORIZ_X = -SUN_DIR[0] / SUN_HORIZ_LEN;
    SUN_HORIZ_Z = -SUN_DIR[2] / SUN_HORIZ_LEN;
    SUN_PERP_X = -SUN_HORIZ_Z;
    SUN_PERP_Z = SUN_HORIZ_X;

    SUN_RADIANCE[0] = 15.8 + 3.4 * DUSK_FACTOR - 0.5 * HIGH_SUN_FACTOR;
    SUN_RADIANCE[1] = 11.4 - 2.9 * DUSK_FACTOR + 0.6 * HIGH_SUN_FACTOR;
    SUN_RADIANCE[2] = 6.7 - 3.8 * DUSK_FACTOR + 1.0 * HIGH_SUN_FACTOR;

    SKY_ZENITH_RAD[0] = 0.85 - 0.18 * DUSK_FACTOR + 0.05 * HIGH_SUN_FACTOR;
    SKY_ZENITH_RAD[1] = 1.32 - 0.34 * DUSK_FACTOR + 0.10 * HIGH_SUN_FACTOR;
    SKY_ZENITH_RAD[2] = 2.25 - 0.45 * DUSK_FACTOR + 0.18 * HIGH_SUN_FACTOR;

    const sconceBoost = 1.0 + 1.55 * DUSK_FACTOR + 0.32 * narrowFactor;
    SCONCE_RADIANCE[0] = 5.60 * sconceBoost;
    SCONCE_RADIANCE[1] = 2.95 * sconceBoost;
    SCONCE_RADIANCE[2] = 0.95 * sconceBoost;

    const bulbBoost = 1.0 + 0.65 * DUSK_FACTOR + 0.18 * narrowFactor;
    SCONCE_BULB_EMIT[0] = 16.0 * bulbBoost;
    SCONCE_BULB_EMIT[1] = 10.5 * bulbBoost;
    SCONCE_BULB_EMIT[2] = 4.2 * bulbBoost;

    return b;
  }

  const canvas = document.getElementById("c");
  const stageFrame = document.getElementById("stage-frame");
  const stageCaption = document.getElementById("stage-caption");
  const stageWorkspace = document.getElementById("stage-workspace");
  const readoutDims = document.getElementById("readout-dims");

  // Pre-allocate canvas backing store once at fixed 1600x960 pool dimensions
  // so pointer resizing never triggers swapchain backing-store reallocation.
  canvas.width = GL_MAX_W;
  canvas.height = GL_MAX_H;
  canvas.style.width = `${GL_MAX_W}px`;
  canvas.style.height = `${GL_MAX_H}px`;

  glEngine = null;
  window.__gpuReallocCount = 0;

  function renderStage(cssW, cssH) {
    if (!glEngine && glEngine !== false) {
      glEngine = initWebGL2Engine(canvas) || false;
    }
    const availW = Math.max(280, stageWorkspace.clientWidth || (window.innerWidth - 36));
    const clampedW = Math.max(Math.min(354, availW), Math.min(availW, Math.round(cssW)));
    const clampedH = Math.max(280, Math.min(900, Math.round(cssH)));

    stageFrame.style.width = `${clampedW}px`;
    stageFrame.style.height = `${clampedH}px`;
    if (stageCaption) stageCaption.style.width = `${clampedW}px`;

    const activeW = Math.min(GL_MAX_W, Math.max(160, clampedW));
    const activeH = Math.min(GL_MAX_H, Math.max(120, clampedH));

    applyCachedSceneAndLighting(clampedW, clampedH);

    const t0 = performance.now();
    if (glEngine) {
      renderWebGL2Frame(glEngine, activeW, activeH);
      glEngine.gl.flush();
    }
    const elapsedMs = performance.now() - t0;

    window.__lastFrameTimeMs = elapsedMs;
    window.__activeViewport = [activeW, activeH];
    window.paintDone = true;
    window.__renderComplete = true;
    window.__RAYTRACER_DONE = true;
    if (window.__resolvePaintReady) window.__resolvePaintReady();

    if (readoutDims) readoutDims.textContent = `${clampedW} × ${clampedH}`;
  }

  let pointerState = null;
  let rafPending = false;
  let hasCustomSize = false;
  let targetW = Math.min(1120, stageWorkspace.clientWidth || 1120);
  let targetH = window.innerWidth <= 720 ? 440 : 546;

  stageFrame.style.width = `${targetW}px`;
  stageFrame.style.height = `${targetH}px`;
  if (stageCaption) stageCaption.style.width = `${targetW}px`;

  function scheduleStageRender(w, h) {
    targetW = w;
    targetH = h;
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        renderStage(targetW, targetH);
      });
    }
  }

  function attachResizeHandle(el, axis) {
    if (!el) return;
    el.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      el.setPointerCapture(ev.pointerId);
      el.classList.add("is-active");
      hasCustomSize = true;
      pointerState = {
        pointerId: ev.pointerId,
        axis,
        startX: ev.clientX,
        startY: ev.clientY,
        startW: stageFrame.clientWidth || targetW,
        startH: stageFrame.clientHeight || targetH
      };
    });

    el.addEventListener("pointermove", (ev) => {
      if (!pointerState || pointerState.pointerId !== ev.pointerId) return;
      const dx = ev.clientX - pointerState.startX;
      const dy = ev.clientY - pointerState.startY;
      const nextW = pointerState.axis === "y" ? pointerState.startW : pointerState.startW + dx;
      const nextH = pointerState.axis === "x" ? pointerState.startH : pointerState.startH + dy;
      scheduleStageRender(nextW, nextH);
    });

    const endDrag = (ev) => {
      if (!pointerState || pointerState.pointerId !== ev.pointerId) return;
      el.classList.remove("is-active");
      if (el.hasPointerCapture(ev.pointerId)) {
        el.releasePointerCapture(ev.pointerId);
      }
      pointerState = null;
    };

    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
  }

  attachResizeHandle(document.getElementById("handle-e"), "x");
  attachResizeHandle(document.getElementById("handle-s"), "y");
  attachResizeHandle(document.getElementById("handle-se"), "xy");

  window.resizeStage = (w, h) => {
    hasCustomSize = true;
    renderStage(w, h);
  };

  window.addEventListener("resize", () => {
    const availW = Math.max(280, stageWorkspace.clientWidth);
    const nextW = hasCustomSize ? Math.min(targetW, availW) : Math.min(1120, availW);
    const nextH = hasCustomSize
      ? targetH
      : window.innerHeight > window.innerWidth
        ? Math.min(820, Math.max(546, window.innerHeight - 260))
        : window.innerWidth <= 720
          ? 440
          : 546;
    scheduleStageRender(nextW, nextH);
  });

  if (document.readyState === "complete") {
    setTimeout(() => renderStage(targetW, targetH), 20);
  } else {
    window.addEventListener("load", () => setTimeout(() => renderStage(targetW, targetH), 20));
  }
})();
  </script>
</body>
