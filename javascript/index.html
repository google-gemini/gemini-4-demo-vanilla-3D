  float saturate(float x) {
    return clamp(x, 0.0, 1.0);
  }

  float smoothstepCpu(float edge0, float edge1, float x) {
    float denom = edge1 - edge0;
    float safeDenom = (denom > 1e-8 || denom < -1e-8) ? denom : 1e-8;
    float t = saturate((x - edge0) / safeDenom);
    return t * t * (3.0 - 2.0 * t);
  }

  float schlickFresnelScalar(float cosTheta, float f0) {
    float c = saturate(1.0 - saturate(cosTheta));
    float c2 = c * c;
    float c5 = c2 * c2 * c;
    return f0 + (1.0 - f0) * c5;
  }

  float dielectricFresnelExact(float cosI, float etaI, float etaT) {
    float ci = saturate(abs(cosI));
    float ratio = etaI / etaT;
    float sin2T = ratio * ratio * max(0.0, 1.0 - ci * ci);
    if (sin2T >= 1.0) return 1.0;
    float ct = sqrt(max(0.0, 1.0 - sin2T));
    float rs = (etaI * ci - etaT * ct) / max(etaI * ci + etaT * ct, 1e-8);
    float rp = (etaT * ci - etaI * ct) / max(etaT * ci + etaI * ct, 1e-8);
    return 0.5 * (rs * rs + rp * rp);
  }

  float ggxIsotropicD(float nDotH, float roughness) {
    float alpha = max(roughness * roughness, 0.0015);
    float a2 = alpha * alpha;
    float c = saturate(nDotH);
    float c2 = c * c;
    float denom = c2 * (a2 - 1.0) + 1.0;
    return a2 / max(PI * denom * denom, 1e-10);
  }

  float smithGgxG(float nDotV, float nDotL, float roughness) {
    float alpha = max(roughness * roughness, 0.0015);
    float a2 = alpha * alpha;
    float nv = clamp(nDotV, 1e-4, 1.0);
    float nl = clamp(nDotL, 1e-4, 1.0);
    float gv = nl * sqrt(nv * nv * (1.0 - a2) + a2);
    float gl2 = nv * sqrt(nl * nl * (1.0 - a2) + a2);
    return 0.5 / max(gv + gl2, 1e-8);
  }

  float hash2d(int ixi, int iyi, int sdi) {
    uint n0 = (uint(ixi) * 374761393u + uint(iyi) * 668265263u + uint(sdi) * 1442695041u) & 0x7fffffffu;
    uint x = (n0 ^ (n0 >> 13u));
    uint xHi = x >> 16u;
    uint xLo = x & 0xffffu;
    uint pLo = x * 1274126177u;
    uint pShr16 = ((xHi * 19441u) << 16u) + (xHi * 40801u) + (xLo * 19441u) + ((xLo * 40801u) >> 16u);
    uint res = (pLo ^ pShr16) & 0x7fffffffu;
    return float(res) / 2147483647.0;
  }

  float valueNoise2d(float x, float y, int seed) {
    int ox = (seed * 173 + 37) & 1023;
    int oy = (seed * 293 + 91) & 1023;
    float xf = floor(x);
    float yf = floor(y);
    float fx = x - xf;
    float fy = y - yf;
    float ux = fx * fx * (3.0 - 2.0 * fx);
    float uy = fy * fy * (3.0 - 2.0 * fy);

    int ix0 = (int(xf) + ox) & 1023;
    int iy0 = (int(yf) + oy) & 1023;
    int ix1 = (ix0 + 1) & 1023;
    int iy1 = (iy0 + 1) & 1023;

    float c00 = texelFetch(u_randTex, ivec2(ix0, iy0), 0).r;
    float c10 = texelFetch(u_randTex, ivec2(ix1, iy0), 0).r;
    float c01 = texelFetch(u_randTex, ivec2(ix0, iy1), 0).r;
    float c11 = texelFetch(u_randTex, ivec2(ix1, iy1), 0).r;

    float v0 = c00 + ux * (c10 - c00);
    float v1 = c01 + ux * (c11 - c01);
    return v0 + uy * (v1 - v0);
  }

  float fbm2d(float x, float y, int octaves, int seed) {
    float total = 0.0;
    float amp = 1.0;
    float freq = 1.0;
    float norm = 0.0;
    float xr = x;
    float yr = y;
    for (int i = 0; i < 4; i++) {
      if (i >= octaves) break;
      total += amp * valueNoise2d(xr * freq, yr * freq, seed + i * 31);
      norm += amp;
      amp *= 0.5;
      freq *= 2.03;
      float nxr = FBM_CS * xr - FBM_SN * yr;
      float nyr = FBM_SN * xr + FBM_CS * yr;
      xr = nxr;
      yr = nyr;
    }
    return total / max(norm, 1e-8);
  }

  struct HitOut {
    float t;
    bool hit;
    vec3 n;
    vec3 l;
  };

  HitOut intersectRoundedBoxScalar(vec3 ro, vec3 rd, vec3 c, vec3 e, float bevelR) {
    HitOut h;
    h.t = 1e9;
    h.hit = false;
    h.n = vec3(0.0, 1.0, 0.0);
    h.l = vec3(0.0);

    vec3 bmin = c - e;
    vec3 bmax = c + e;
    vec3 safeD = vec3(
      abs(rd.x) < 1e-12 ? (rd.x < 0.0 ? -1e-12 : 1e-12) : rd.x,
      abs(rd.y) < 1e-12 ? (rd.y < 0.0 ? -1e-12 : 1e-12) : rd.y,
      abs(rd.z) < 1e-12 ? (rd.z < 0.0 ? -1e-12 : 1e-12) : rd.z
    );
    vec3 invD = 1.0 / safeD;
    vec3 t0 = (bmin - ro) * invD;
    vec3 t1 = (bmax - ro) * invD;
    vec3 tmin = min(t0, t1);
    vec3 tmax = max(t0, t1);
    float tNear = max(max(tmin.x, tmin.y), tmin.z);
    float tFar = min(min(tmax.x, tmax.y), tmax.z);
    if (tFar < max(tNear, 1e-4) || tNear <= 1e-4) return h;

    vec3 fn = vec3(0.0);
    if (abs(tNear - tmin.x) < 1e-7) {
      fn.x = rd.x >= 0.0 ? -1.0 : 1.0;
    } else if (abs(tNear - tmin.y) < 1e-7) {
      fn.y = rd.y >= 0.0 ? -1.0 : 1.0;
    } else {
      fn.z = rd.z >= 0.0 ? -1.0 : 1.0;
    }

    vec3 p = ro + tNear * rd - c;
    vec3 inE = max(e - bevelR, vec3(1e-4));
    vec3 q = max(abs(p) - inE, vec3(0.0)) * vec3(
      p.x >= 0.0 ? 1.0 : -1.0,
      p.y >= 0.0 ? 1.0 : -1.0,
      p.z >= 0.0 ? 1.0 : -1.0
    );
    float outNorm = length(q);
    vec3 sn = outNorm > 1e-5 ? (q / outNorm) : fn;
    vec3 n = fn + 0.85 * sn;
    float nLen = length(n);
    h.t = tNear;
    h.hit = true;
    h.n = n / (nLen > 0.0 ? nLen : 1.0);
    h.l = p;
    return h;
  }

  HitOut intersectObbYScalar(vec3 ro, vec3 rd, vec3 c, vec3 e, float yawRad, float bevelR, float tiltXRad) {
    vec3 rel = ro - c;
    float cyN = cos(-yawRad), syN = sin(-yawRad);
    vec3 r = vec3(cyN * rel.x + syN * rel.z, rel.y, -syN * rel.x + cyN * rel.z);
    vec3 d = vec3(cyN * rd.x + syN * rd.z, rd.y, -syN * rd.x + cyN * rd.z);

    if (abs(tiltXRad) > 1e-6) {
      float cxN = cos(-tiltXRad), sxN = sin(-tiltXRad);
      r = vec3(r.x, cxN * r.y - sxN * r.z, sxN * r.y + cxN * d.z * 0.0 + cxN * r.z);
      r = vec3(cyN * rel.x + syN * rel.z, cxN * rel.y - sxN * (-syN * rel.x + cyN * rel.z), sxN * rel.y + cxN * (-syN * rel.x + cyN * rel.z));
      d = vec3(cyN * rd.x + syN * rd.z, cxN * rd.y - sxN * (-syN * rd.x + cyN * rd.z), sxN * rd.y + cxN * (-syN * rd.x + cyN * rd.z));
    }

    HitOut res = intersectRoundedBoxScalar(r, d, vec3(0.0), e, bevelR);
    if (!res.hit) return res;

    vec3 n = res.n;
    if (abs(tiltXRad) > 1e-6) {
      float cxP = cos(tiltXRad), sxP = sin(tiltXRad);
      n = vec3(n.x, cxP * n.y - sxP * n.z, sxP * n.y + cxP * n.z);
    }
    float cyW = cos(yawRad), syW = sin(yawRad);
    vec3 w = vec3(cyW * n.x + syW * n.z, n.y, -syW * n.x + cyW * n.z);
    float nLen = length(w);
    res.n = w / (nLen > 0.0 ? nLen : 1.0);
    return res;
  }

  HitOut intersectCylinderSegmentScalar(vec3 ro, vec3 rd, vec3 pa, vec3 pb, float radius, bool capped) {
    HitOut h;
    h.t = 1e9;
    h.hit = false;
    h.n = vec3(0.0, 1.0, 0.0);
    h.l = vec3(0.0);

    vec3 ba = pb - pa;
    float baLen = max(length(ba), 1e-6);
    vec3 a = ba / baLen;
    vec3 oc = ro - pa;
    float rdDotA = dot(rd, a);
    float ocDotA = dot(oc, a);
    vec3 dp = rd - rdDotA * a;
    vec3 op = oc - ocDotA * a;

    float aCoef = dot(dp, dp);
    float bCoef = dot(op, dp);
    float cCoef = dot(op, op) - radius * radius;
    float disc = bCoef * bCoef - aCoef * cCoef;

    float tBest = 1e9;
    bool hitAny = false;
    vec3 nb = vec3(0.0, 1.0, 0.0);

    if (disc >= 0.0 && aCoef > 1e-10) {
      float sqrtDisc = sqrt(disc);
      float tSide = (-bCoef - sqrtDisc) / aCoef;
      float ySide = ocDotA + tSide * rdDotA;
      if (tSide > 1e-4 && ySide >= 0.0 && ySide <= baLen) {
        vec3 ph = oc + tSide * rd - ySide * a;
        float nLen = length(ph);
        tBest = tSide;
        hitAny = true;
        nb = ph / (nLen > 0.0 ? nLen : 1.0);
      }
    }

    if (capped) {
      float safeRdA = abs(rdDotA) < 1e-10 ? (rdDotA < 0.0 ? -1e-10 : 1e-10) : rdDotA;
      float invRdA = 1.0 / safeRdA;
      float tCap0 = -ocDotA * invRdA;
      if (tCap0 > 1e-4 && tCap0 < tBest) {
        vec3 c0 = op + tCap0 * dp;
        if (dot(c0, c0) <= radius * radius) {
          tBest = tCap0;
          hitAny = true;
          nb = -a;
        }
      }
      float tCap1 = (baLen - ocDotA) * invRdA;
      if (tCap1 > 1e-4 && tCap1 < tBest) {
        vec3 c1 = op + tCap1 * dp;
        if (dot(c1, c1) <= radius * radius) {
          tBest = tCap1;
          hitAny = true;
          nb = a;
        }
      }
    }

    h.t = tBest;
    h.hit = hitAny;
    h.n = nb;
    return h;
  }

  HitOut intersectEllipsoidScalar(vec3 ro, vec3 rd, vec3 c, vec3 rRad, float yawRad) {
    HitOut h;
    h.t = 1e9;
    h.hit = false;
    h.n = vec3(0.0, 1.0, 0.0);
    h.l = vec3(0.0);

    vec3 rel = ro - c;
    vec3 r = rel;
    vec3 d = rd;
    float cyW = 1.0, syW = 0.0;
    if (yawRad != 0.0) {
      float cyN = cos(-yawRad), syN = sin(-yawRad);
      r = vec3(cyN * rel.x + syN * rel.z, rel.y, -syN * rel.x + cyN * rel.z);
      d = vec3(cyN * rd.x + syN * rd.z, rd.y, -syN * rd.x + cyN * rd.z);
      cyW = cos(yawRad);
      syW = sin(yawRad);
    }

    vec3 invR = 1.0 / rRad;
    vec3 o = r * invR;
    vec3 v = d * invR;
    float a = dot(v, v);
    float b = dot(o, v);
    float cc = dot(o, o) - 1.0;
    float disc = b * b - a * cc;
    if (disc < 0.0) return h;

    float t = (-b - sqrt(disc)) / max(a, 1e-10);
    if (t <= 1e-4) return h;

    vec3 p = r + t * d;
    vec3 nL = p * invR * invR;
    vec3 w = vec3(cyW * nL.x + syW * nL.z, nL.y, -syW * nL.x + cyW * nL.z);
    float nLen = length(w);
    h.t = t;
    h.hit = true;
    h.n = w / (nLen > 0.0 ? nLen : 1.0);
    return h;
  }

  bool rayHitsSphereScalar(vec3 ro, vec3 rd, vec3 c, float radius, float tMax) {
    vec3 oc = c - ro;
    float tProj = dot(oc, rd);
    if (tProj + radius <= 1e-4 || tProj - radius >= tMax) return false;
    float d2 = dot(oc, oc) - tProj * tProj;
    return d2 <= radius * radius;
  }

  vec3 skyRadianceForDir(vec3 dDir) {
    float elev = saturate(dDir.y);
    float tSky = smoothstepCpu(0.004, 0.25, elev);
    float d = u_duskFactor;
    float h = u_highSunFactor;

    vec3 horiz = vec3(
      1.18 + 0.28 * d - 0.06 * h,
      1.12 - 0.16 * d + 0.04 * h,
      1.04 - 0.34 * d + 0.10 * h
    );
    vec3 zen = vec3(
      0.22 - 0.06 * d - 0.03 * h,
      0.52 - 0.15 * d + 0.05 * h,
      1.22 - 0.24 * d + 0.12 * h
    );
    vec3 col = mix(horiz, zen, tSky);

    float sunCos = clamp(dot(dDir, u_sunDir), -1.0, 1.0);
    float posCos = max(0.0, sunCos);
    float horizonGlow = exp(-elev * (14.0 - 3.5 * d)) * (0.30 + 0.70 * posCos * posCos) * (1.0 + 0.35 * d);
    col += horizonGlow * vec3(1.05 + 0.25 * d, 0.72 - 0.10 * d, 0.36 - 0.12 * d);

    float mieLobe = pow(posCos, 22.0) * 0.85 + pow(posCos, 140.0) * 7.5;
    float sunDisc = smoothstepCpu(0.9992, 0.99985, sunCos) * 36.0;
    float mTot = mieLobe + sunDisc;
    col += mTot * vec3(1.15 + 0.18 * d, 0.80 - 0.10 * d, 0.42 - 0.14 * d);

    if (elev > 0.04) {
      float phi = atan(dDir.x, max(dDir.z, 1e-4)) + u_mountainParallaxPhi * 0.35;
      float uCloud = phi * 3.8 + elev * 3.2;
      float vCloud = elev * 18.0 - phi * 2.4;
      float cWarp = fbm2d(uCloud * 0.85, vCloud * 0.85, 2, 771);
      float cirrus1 = fbm2d(uCloud + cWarp * 1.35, vCloud * 1.4, 3, 787);
      float cirrus2 = valueNoise2d(uCloud * 5.5 - cWarp * 2.2, vCloud * 4.5, 793);
      float fiber = 0.65 * cirrus1 + 0.35 * cirrus2;
      float altBand = smoothstepCpu(0.05, 0.13, elev) * (1.0 - smoothstepCpu(0.32, 0.52, elev));
      float cAlpha = smoothstepCpu(0.53, 0.74, fiber) * altBand * 0.82;
      float sunWarm = 0.40 + 0.60 * pow(posCos, 2.2);
      vec3 cCol = vec3(
        (1.45 + 0.22 * d) * sunWarm + 0.55 * (1.0 - 0.25 * d),
        (1.28 - 0.14 * d) * sunWarm + 0.58 * (1.0 - 0.20 * d),
        (1.08 - 0.32 * d) * sunWarm + 0.66 * (1.0 - 0.15 * d)
      );
      col = mix(col, cCol, cAlpha);
    }
    return col;
  }

  float ridgedMountain1D(float u, int octaves, int seed) {
    float sum = 0.0;
    float amp = 0.54;
    float freq = 1.0;
    float weight = 1.0;
    float norm = 0.0;
    for (int i = 0; i < 4; i++) {
      if (i >= octaves) break;
      float fi = float(i);
      float n1 = valueNoise2d(u * freq, fi * 19.3 + 7.1, seed + i * 43);
      float n2 = valueNoise2d(u * freq * 1.37 + 5.2, fi * 11.7 + 3.4, seed + i * 71);
      float f1 = 1.0 - abs(2.0 * n1 - 1.0);
      float f2 = 1.0 - abs(2.0 * n2 - 1.0);
      float ridge = pow(0.64 * f1 + 0.36 * f2, 1.55);
      sum += ridge * weight * amp;
      norm += amp;
      weight = clamp(ridge * 1.55, 0.25, 1.0);
      freq *= 2.18;
      amp *= 0.50;
    }
    return sum / max(norm, 1e-6);
  }

  float evalMountainSlopeRelief(float u, float v, int seed) {
    float wx = fbm2d(u * 0.65, v * 0.65, 2, seed + 5) - 0.5;
    float wy = fbm2d(u * 0.65 + 9.4, v * 0.65 + 4.7, 2, seed + 13) - 0.5;
    float xr = u + wx * 0.85;
    float yr = v + wy * 0.85;
    float total = 0.0;
    float amp = 0.55;
    float weight = 1.0;
    float norm = 0.0;
    for (int i = 0; i < 4; i++) {
      float n = valueNoise2d(xr, yr, seed + 29 + i * 37);
      float r = 1.0 - abs(2.0 * n - 1.0);
      r = r * r * (1.5 - 0.5 * r);
      total += r * weight * amp;
      norm += amp;
      weight = clamp(r * 1.45, 0.25, 1.0);
      float nxr = (FBM_CS * xr - FBM_SN * yr) * 2.12 + 4.1;
      float nyr = (FBM_SN * xr + FBM_CS * yr) * 2.12 + 2.7;
      xr = nxr;
      yr = nyr;
      amp *= 0.48;
    }
    return total / max(norm, 1e-6);
  }

  float evalMountainRidgeHeight(float phiBase, int layer) {
    float u = phiBase + u_mountainParallaxPhi * (0.55 + 0.15 * float(layer));
    if (layer == 0) {
      float massif = 0.046 +
        0.118 * exp(-pow(abs(u - 0.24) / 0.165, 1.38)) +
        0.136 * exp(-pow(abs(u - 0.68) / 0.210, 1.38)) +
        0.114 * exp(-pow(abs(u - 1.12) / 0.220, 1.38)) +
        0.086 * exp(-pow(abs(u + 0.12) / 0.180, 1.38));
      float rMacro = ridgedMountain1D(u * 3.6 + 1.3, 3, 301);
      float rCrag = ridgedMountain1D(u * 11.5 + 4.7, 3, 319);
      return massif * (0.68 + 0.34 * rMacro + 0.10 * rCrag);
    } else if (layer == 1) {
      float massif = 0.030 +
        0.076 * exp(-pow(abs(u - 0.43) / 0.185, 1.35)) +
        0.088 * exp(-pow(abs(u - 0.88) / 0.205, 1.35)) +
        0.078 * exp(-pow(abs(u - 1.30) / 0.195, 1.35)) +
        0.062 * exp(-pow(abs(u - 0.04) / 0.165, 1.35));
      float rMacro = ridgedMountain1D(u * 4.4 + 8.2, 3, 347);
      float rCrag = ridgedMountain1D(u * 14.0 + 2.1, 3, 367);
      return massif * (0.68 + 0.32 * rMacro + 0.09 * rCrag);
    } else if (layer == 2) {
      float massif = 0.016 +
        0.044 * exp(-pow(abs(u - 0.18) / 0.220, 1.32)) +
        0.050 * exp(-pow(abs(u - 0.56) / 0.195, 1.32)) +
        0.054 * exp(-pow(abs(u - 1.00) / 0.230, 1.32));
      float rMacro = ridgedMountain1D(u * 5.2 + 15.4, 3, 389);
      float rCrag = ridgedMountain1D(u * 16.5 + 6.3, 2, 401);
      return massif * (0.70 + 0.30 * rMacro + 0.07 * rCrag);
    } else {
      float massif = 0.006 +
        0.018 * exp(-pow(abs(u - 0.32) / 0.260, 1.30)) +
        0.022 * exp(-pow(abs(u - 0.80) / 0.250, 1.30)) +
        0.018 * exp(-pow(abs(u - 1.24) / 0.220, 1.30));
      float rMacro = ridgedMountain1D(u * 6.4 + 23.1, 3, 431);
      return massif * (0.72 + 0.28 * rMacro);
    }
  }

  vec3 sampleCourtyardBackdrop(vec3 dDir) {
    vec3 col = skyRadianceForDir(dDir);
    float phi = atan(dDir.x, max(dDir.z, 1e-4));
    float elev = dDir.y;
    if (elev >= 0.25 || elev < -0.025) return col;

    vec3 horizSky = skyRadianceForDir(vec3(dDir.x, 0.018, dDir.z));
    float dusk = u_duskFactor;
    vec3 haz = horizSky * vec3(0.56 + 0.18 * dusk, 0.65 - 0.04 * dusk, 0.84 - 0.10 * dusk);

    float sunPhi = atan(u_sunDir.x, max(u_sunDir.z, 1e-4));
    float sunAzSign = sunPhi >= phi - 0.15 ? 1.0 : -1.0;

    float epsPhi = 0.0035;
    float baseHaze[4] = float[4](0.36, 0.25, 0.15, 0.06);
    float isoScale[4] = float[4](22.0, 28.0, 36.0, 46.0);

    for (int layer = 0; layer < 4; layer++) {
      float hC = evalMountainRidgeHeight(phi, layer);
      if (elev < hC + 0.0018 && elev >= -0.0060) {
        float dCrest = max(hC - elev, 0.0);
        float edgeAlpha = smoothstepCpu(-0.0010, 0.0011, hC - elev);
        if (edgeAlpha <= 1e-4) continue;

        int seedL = 521 + layer * 67;
        float sc = isoScale[layer];
        float meander = (fbm2d(phi * 14.0, elev * 14.0, 3, seedL + 3) - 0.5) * 0.024 * min(dCrest * 18.0, 1.0);
        float phiArete = phi + dCrest * ((layer % 2 == 0) ? 0.22 : -0.18) + meander;
        float hPlus = evalMountainRidgeHeight(phiArete + epsPhi, layer);
        float hMinus = evalMountainRidgeHeight(phiArete - epsPhi, layer);
        float dH_dPhi = (hPlus - hMinus) / (2.0 * epsPhi);

        float u = (phi + u_mountainParallaxPhi * (0.55 + 0.15 * float(layer))) * sc - dCrest * dH_dPhi * 1.15;
        float v = elev * sc * 1.05;

        float r0 = evalMountainSlopeRelief(u, v, seedL);
        float rDu = evalMountainSlopeRelief(u + 0.10, v, seedL);
        float rDv = evalMountainSlopeRelief(u, v + 0.10, seedL);
        float dR_du = (rDu - r0) / 0.10;
        float dR_dv = (rDv - r0) / 0.10;

        float rockFbm = fbm2d(u * 1.45, v * 1.45, 3, seedL + 19);
        float fineCrag = fbm2d(u * 3.8, v * 3.8, 2, seedL + 41);

        float facetPhi = (-dH_dPhi * 1.35 + dR_du * 0.36) * sunAzSign;
        float facetElev = 0.38 - dR_dv * 0.32;
        float sunFacing = smoothstepCpu(-0.16, 0.18, facetPhi);
        float selfShadow = smoothstepCpu(-0.28, 0.04, facetPhi);
        float crestRim = exp(-dCrest * 185.0) * smoothstepCpu(-0.04, 0.20, facetPhi);
        float areteHighlight = exp(-abs(dH_dPhi) * 9.5) * smoothstepCpu(0.45, 0.78, r0) * 0.32;
        float cliffSteepness = abs(dH_dPhi) * 1.6 + abs(dR_du) * 0.55;

        vec3 rock = vec3(0.0);
        float isSnow = 0.0;
        if (layer == 0) {
          float snowLine = 0.052 + 0.018 * (rockFbm - 0.5) - 0.010 * sunFacing;
          float altSnow = smoothstepCpu(snowLine, snowLine + 0.038, elev);
          float slopeHoldsSnow = 1.0 - smoothstepCpu(0.26, 0.68, cliffSteepness);
          float gullyPocket = smoothstepCpu(0.36, 0.68, (1.0 - r0) * 0.62 + rockFbm * 0.38);
          float summitCornice = exp(-dCrest * 110.0) * 0.80;
          isSnow = saturate(altSnow * (0.72 * slopeHoldsSnow + 0.55 * gullyPocket) + summitCornice * altSnow);
          float granVar = 0.72 + 0.46 * (0.55 * rockFbm + 0.45 * fineCrag);
          rock = mix(vec3(0.15, 0.16, 0.20) * granVar, vec3(0.91, 0.92, 0.96), isSnow);
        } else if (layer == 1) {
          float snowLine = 0.066 + 0.014 * (rockFbm - 0.5);
          float altSnow = smoothstepCpu(snowLine, snowLine + 0.032, elev);
          float couloirPocket = smoothstepCpu(0.46, 0.74, (1.0 - r0) * 0.68 + rockFbm * 0.32);
          isSnow = saturate(altSnow * couloirPocket * 0.82);
          float granVar = 0.72 + 0.46 * (0.58 * rockFbm + 0.42 * fineCrag);
          rock = mix(vec3(0.18, 0.17, 0.19) * granVar, vec3(0.87, 0.88, 0.92), isSnow);
        } else if (layer == 2) {
          float heather = smoothstepCpu(0.38, 0.72, rockFbm) * (1.0 - smoothstepCpu(0.024, 0.060, elev));
          float granVar = 0.82 + 0.24 * (0.65 * rockFbm + 0.35 * fineCrag);
          rock = (vec3(0.16, 0.16, 0.18) * (1.0 - 0.45 * heather) + vec3(0.10, 0.14, 0.11) * heather) * granVar;
        } else {
          float wetShore = 1.0 - smoothstepCpu(0.0005, 0.0045, max(elev, 0.0));
          float granVar = (0.84 + 0.20 * rockFbm) * (1.0 - 0.38 * wetShore);
          rock = vec3(0.14, 0.15, 0.16) * granVar;
        }

        float layerContrast = layer <= 1 ? 1.0 : (layer == 2 ? 0.68 : 0.48);
        float sunMix = (1.0 - layerContrast) * 0.42 + layerContrast * (sunFacing * selfShadow + areteHighlight);
        vec3 sunC = vec3(
          (1.65 + 0.46 * dusk) * sunMix + crestRim * (0.52 + 0.25 * isSnow),
          (1.24 - 0.15 * dusk) * sunMix + crestRim * (0.40 + 0.20 * isSnow),
          (0.80 - 0.28 * dusk) * sunMix + crestRim * (0.22 + 0.15 * isSnow)
        );
        float skyDomeWeight = 0.64 + 0.36 * saturate(facetElev);
        vec3 shdC = vec3(
          0.23 + 0.07 * isSnow - 0.03 * dusk,
          0.37 + 0.11 * isSnow - 0.06 * dusk,
          0.66 + 0.18 * isSnow - 0.08 * dusk
        ) * skyDomeWeight;

        vec3 lit = rock * (shdC + sunC);
        float valleyMist = exp(-pow(max(elev, 0.0) / (0.026 + 0.010 * float(3 - layer)), 1.6)) * (0.28 - 0.04 * float(layer));
        float shoreMist = exp(-max(elev, 0.0) * 180.0) * 0.26;
        float altClear = 1.0 - 0.40 * saturate(elev / 0.14);
        float fogW = clamp(baseHaze[layer] * altClear + valleyMist + shoreMist, 0.0, 0.72);
        lit = mix(lit, haz, fogW);
        col = mix(col, lit, edgeAlpha);
      }
    }
    return col;
  }

  vec3 evaluateExteriorCourtyardScalar(vec3 ro, vec3 rd) {
    float waterY = -0.04;
    float denomY = abs(rd.y) < 1e-8 ? -1e-8 : rd.y;
    float tWater = (waterY - ro.y) / denomY;
    if (rd.y < -0.0001 && tWater > 0.0 && tWater < 8000.0) {
      float wx = ro.x + tWater * rd.x;
      float wz = ro.z + tWater * rd.z;
      if (wx < u_roomXRight + 0.32 && wz < u_roomZBack + 0.32) {
        float patioNoise = valueNoise2d(wx * 6.0, wz * 6.0, 405);
        float pMult = 0.9 + 0.2 * patioNoise;
        return vec3(0.38, 0.36, 0.33) * pMult * (u_sunRadiance * 0.22 + u_skyZenithRad * 0.45);
      }

      float wClamp = min(tWater, 95.0);
      float wxEff = ro.x + wClamp * rd.x;
      float wzEff = ro.z + wClamp * rd.z;
      float attenW = 0.48 + 0.52 / (1.0 + 0.055 * tWater);
      float waveN1 = valueNoise2d(wxEff * 1.55 + wzEff * 0.55, wzEff * 3.40 - wxEff * 0.35, 411) - 0.5;
      float waveN2 = valueNoise2d(wxEff * 3.80 - wzEff * 1.10, wzEff * 7.40 + wxEff * 0.80, 419) - 0.5;
      float phiW = atan(rd.x, max(rd.z, 1e-4));
      float capWave = valueNoise2d(phiW * 95.0, rd.y * 820.0, 427) - 0.5;
      vec3 nW = normalize(vec3(
        0.012 * (waveN1 + 0.45 * waveN2) * attenW + 0.016 * capWave,
        1.0,
        0.016 * (waveN2 - 0.55 * waveN1) * attenW + 0.012 * capWave
      ));
      float dDotN = dot(rd, nW);
      float reflElev = abs(rd.y) * 0.88 + 0.014 * abs(capWave) + 0.008;
      vec3 rf = normalize(vec3(
        rd.x - 2.0 * dDotN * nW.x,
        max(reflElev, 0.006),
        rd.z - 2.0 * dDotN * nW.z
      ));
      vec3 backdrop = sampleCourtyardBackdrop(rf);
      float cosTheta = saturate(-dDotN);
      float shoreDarken = 0.58 + 0.42 * smoothstepCpu(0.0, 0.022, -rd.y);
      float fWater = min(dielectricFresnelExact(cosTheta, 1.0, 1.333), 0.84) * shoreDarken;
      float basinMult = 0.72 + 0.28 * exp(-0.12 * max(0.0, wx - u_roomXRight));
      vec3 wCol = (1.0 - fWater) * vec3(0.06, 0.11, 0.15) * basinMult + fWater * backdrop;
      vec3 hVec = normalize(u_sunDir - rd);
      float glint = ggxIsotropicD(saturate(dot(nW, hVec)), 0.058) * 0.068;
      return wCol + glint * u_sunRadiance;
    }
    return sampleCourtyardBackdrop(rd);
  }

  float boxOcc3D(vec3 p, vec3 c, vec3 e, float basePen, float penRate, vec3 invHyp) {
    if (p.x >= c.x + e.x - 0.004 || p.y >= c.y + e.y - 0.004 || p.z >= c.z + e.z - 0.004) {
      return 0.0;
    }
    if (
      p.y > 0.004 &&
      abs(p.x - c.x) <= e.x + 0.008 &&
      abs(p.y - c.y) <= e.y + 0.008 &&
      abs(p.z - c.z) <= e.z + 0.008
    ) {
      return 0.0;
    }
    vec3 s = u_sunDir;
    vec3 d = p - c;
    float dXY = (abs(d.x * s.y - d.y * s.x) - (e.x * s.y + e.y * s.x)) * invHyp.x;
    float dYZ = (abs(d.y * s.z - d.z * s.y) - (e.y * s.z + e.z * s.y)) * invHyp.y;
    float dXZ = (abs(d.x * s.z - d.z * s.x) - (e.x * s.z + e.z * s.x)) * invHyp.z;
    float sDist = length(max(vec3(dXY, dYZ, dXZ), vec3(0.0))) + min(max(max(dXY, dYZ), dXZ), 0.0);

    vec3 t0 = (-d - e) / s;
    vec3 t1 = (-d + e) / s;
    float tEnter = max(0.0, max(max(t0.x, t0.y), t0.z));
    float tExit = min(min(t1.x, t1.y), t1.z);
    if (tExit <= 0.002) return 0.0;
    float tSample = max(0.0, 0.5 * (tEnter + tExit));
    float pen = basePen + penRate * tSample;
    return 1.0 - smoothstepCpu(-pen * 0.65, pen * 0.85, sDist);
  }

  float boxOccLocal3D(vec3 p, vec3 s, vec3 c, vec3 e, float basePen, float penRate, vec3 invHyp) {
    if (p.y >= c.y + e.y - 0.004) {
      return 0.0;
    }
    if (
      p.y > 0.004 &&
      abs(p.x - c.x) <= e.x + 0.008 &&
      abs(p.y - c.y) <= e.y + 0.008 &&
      abs(p.z - c.z) <= e.z + 0.008
    ) {
      return 0.0;
    }
    vec3 d = p - c;
    vec3 as = abs(s);
    float dXY = (abs(d.x * s.y - d.y * s.x) - (e.x * as.y + e.y * as.x)) * invHyp.x;
    float dYZ = (abs(d.y * s.z - d.z * s.y) - (e.y * as.z + e.z * as.y)) * invHyp.y;
    float dXZ = (abs(d.x * s.z - d.z * s.x) - (e.x * as.z + e.z * as.x)) * invHyp.z;
    float sDist = length(max(vec3(dXY, dYZ, dXZ), vec3(0.0))) + min(max(max(dXY, dYZ), dXZ), 0.0);

    vec3 safeS = vec3(
      abs(s.x) > 1e-6 ? s.x : (s.x >= 0.0 ? 1e-6 : -1e-6),
      abs(s.y) > 1e-6 ? s.y : 1e-6,
      abs(s.z) > 1e-6 ? s.z : (s.z >= 0.0 ? 1e-6 : -1e-6)
    );
    vec3 t0 = (-d - e) / safeS;
    vec3 t1 = (-d + e) / safeS;
    vec3 tMin = min(t0, t1);
    vec3 tMax = max(t0, t1);
    float tEnter = max(0.0, max(max(tMin.x, tMin.y), tMin.z));
    float tExit = min(min(tMax.x, tMax.y), tMax.z);
    if (tExit <= 0.002) return 0.0;
    float tSample = max(0.0, 0.5 * (tEnter + tExit));
    float pen = basePen + penRate * tSample;
    return 1.0 - smoothstepCpu(-pen * 0.65, pen * 0.85, sDist);
  }

  float rayEllipsoidShadow(vec3 p, vec3 c, vec3 r, vec3 s, float penBase, float penSlope, float selfPad) {
    vec3 o = (p - c) / r;
    vec3 v = s / r;
    float v2 = dot(v, v);
    float tPos = max(-dot(o, v) / v2, 0.0);
    vec3 q = o + tPos * v;
    float rSelf = length(o);
    if (rSelf <= selfPad) return 0.0;
    float rEff = (r.x + r.y + r.z) * 0.33333333;
    float dSurf = (length(q) - 1.0) * rEff;
    float pen = penBase + penSlope * tPos;
    return 1.0 - smoothstepCpu(-pen, pen, dSurf);
  }

  float rayCylYShadow(vec3 p, vec2 c, float y0, float y1, float radius, vec3 s, float penBase, float penSlope, bool excludeSelf) {
    if (excludeSelf) return 0.0;
    float tY1 = max((y1 - p.y) / s.y, 0.0);
    if (tY1 <= 0.002) return 0.0;
    vec2 oc = p.xz - c;
    float aXz = dot(s.xz, s.xz);
    float tXz = max(-dot(oc, s.xz) / aXz, 0.0);
    float tY0 = max((y0 - p.y) / s.y, 0.0);
    float tEval = clamp(tXz, tY0, tY1);
    vec2 dXz = oc + tEval * s.xz;
    float yEval = p.y + tEval * s.y;
    float dY = max(max(y0 - yEval, yEval - y1), 0.0);
    float dRad = length(dXz) - radius;
    float d3d = length(vec2(max(dRad, 0.0), dY)) + min(dRad, 0.0);
    float pen = penBase + penSlope * tEval;
    return 1.0 - smoothstepCpu(-pen, pen, d3d);
  }

  float evaluateWindowSunTransmissionScalar(vec3 p) {
    float tx = (u_roomXRight - p.x) / u_sunDir.x;
    float tz = (u_roomZBack - p.z) / u_sunDir.z;
    float tExit = min(tx, tz);
    if (tExit <= 0.0) return 0.0;

    vec3 w = p + tExit * u_sunDir;
    float penR = 0.018 + 0.022 * clamp(tExit, 0.0, 10.0);
    bool onRightWall = tx <= tz;
    float winTop = u_windowTopY - 0.02;

    float apertureVis = smoothstepCpu(0.09 - penR, 0.09 + penR, w.y) * (1.0 - smoothstepCpu(winTop - penR, winTop + penR, w.y));
    if (onRightWall) {
      apertureVis *= smoothstepCpu(-0.15 - penR, -0.15 + penR, w.z) * (1.0 - smoothstepCpu(7.52 - penR, 7.52 + penR, w.z));
    } else {
      float backWinMinX = u_backConcreteXMax + 0.06;
      float backWinMaxX = u_roomXRight - 0.02;
      apertureVis *= smoothstepCpu(backWinMinX - penR, backWinMinX + penR, w.x) * (1.0 - smoothstepCpu(backWinMaxX - penR, backWinMaxX + penR, w.x));
    }
    if (apertureVis <= 1e-6) return 0.0;

    float mullionHalfW = 0.042;
    float transomHalfH = 0.032;
    float visVertMull = 1.0;
    const float rightMullZ[5] = float[5](-0.20, 1.65, 3.55, 5.50, 7.52);

    if (onRightWall) {
      float distMullZ = 10.0;
      for (int i = 0; i < 5; i++) {
        distMullZ = min(distMullZ, abs(w.z - rightMullZ[i]));
      }
      visVertMull = smoothstepCpu(mullionHalfW - penR * 0.45, mullionHalfW + penR * 0.85, distMullZ);
    } else {
      float distMullX = 10.0;
      for (int i = 0; i < 4; i++) {
        if (i >= u_numBackMullions) break;
        distMullX = min(distMullX, abs(w.x - u_backMullionX[i]));
      }
      visVertMull = smoothstepCpu(mullionHalfW - penR * 0.45, mullionHalfW + penR * 0.85, distMullX);
    }

    float distTransY = 10.0;
    for (int i = 0; i < 4; i++) {
      distTransY = min(distTransY, abs(w.y - u_rightTransomY[i]));
    }
    if (u_numRightTransoms > 4) {
      distTransY = min(distTransY, abs(w.y - u_rightTransomY4));
    }
    float visTrans = smoothstepCpu(transomHalfH - penR * 0.45, transomHalfH + penR * 0.85, distTransY);

    float cornerDist = length(vec2(w.x - u_roomXRight, w.z - u_roomZBack));
    float visCorner = smoothstepCpu(0.08 - penR * 0.4, 0.08 + penR * 0.8, cornerDist);

    float sunVis = apertureVis * visVertMull * visTrans * visCorner;
    if (sunVis <= 1e-6) return 0.0;

    vec3 s = u_sunDir;
    vec3 invHyp = vec3(
      1.0 / length(vec2(s.x, s.y)),
      1.0 / length(vec2(s.y, s.z)),
      1.0 / length(vec2(s.x, s.z))
    );
    vec2 sunSl = s.xz / max(s.y, 0.05);

    float tableShadow = 0.0;
    if (p.y < 0.342) {
      float tabCx = 0.33 + u_tableParams.x;
      float tabCz = 1.77 + u_tableParams.y;
      float occTop = boxOcc3D(p, vec3(tabCx, 0.36, tabCz), vec3(u_tableParams.z, 0.030, 0.69), 0.012, 0.024, invHyp);
      float occPed = rayCylYShadow(p, vec2(tabCx, tabCz), 0.0, 0.334, 0.315, s, 0.008, 0.024, false);
      tableShadow = max(occTop, occPed) * 0.994;
    }

    float stillLifeShadow = 0.0;
    if (p.y > 0.386 && p.y < 0.680 && p.x > -0.68 + u_tableParams.x && p.x < 1.00 + u_tableParams.x && p.z > 1.05 + u_tableParams.y && p.z < 2.48 + u_tableParams.y) {
      vec2 cupC = vec2(0.24, 1.82) + u_tableParams.xy;
      vec2 cupR = p.xz - cupC;
      bool isCupOuterWall = (p.y > 0.397 && p.y <= 0.483 && length(cupR) > 0.050 && dot(cupR, s.xz) > -0.008);
      float shCupBody = rayCylYShadow(p, cupC, 0.400, 0.482, 0.053, s, 0.003, 0.022, isCupOuterWall) * 0.92;
      float shSaucer = rayEllipsoidShadow(
        p,
        vec3(cupC.x, 0.400, cupC.y),
        vec3(0.088, 0.0105, 0.088),
        s,
        0.003,
        0.020,
        1.04
      ) * 0.88;

      float occCbBot = boxOcc3D(
        p,
        vec3(-0.12 + u_tableParams.x, 0.405, 2.04 + u_tableParams.y),
        vec3(0.162, 0.015, 0.218),
        0.005,
        0.018,
        invHyp
      ) * 0.91;
      float occCbTop = boxOcc3D(
        p,
        vec3(-0.12 + u_tableParams.x, 0.436, 2.04 + u_tableParams.y),
        vec3(0.145, 0.016, 0.195),
        0.005,
        0.018,
        invHyp
      ) * 0.91;
      float shCbook = max(occCbBot, occCbTop);

      vec2 obRel = p.xz - u_bookCarafePos.xy;
      vec3 obLocP = vec3(
        BOOK_COS_019 * obRel.x + BOOK_SIN_019 * obRel.y,
        p.y,
        -BOOK_SIN_019 * obRel.x + BOOK_COS_019 * obRel.y
      );
      vec3 obLocS = vec3(
        BOOK_COS_019 * s.x + BOOK_SIN_019 * s.z,
        s.y,
        -BOOK_SIN_019 * s.x + BOOK_COS_019 * s.z
      );
      vec3 obInvHyp = vec3(
        1.0 / length(vec2(obLocS.x, obLocS.y)),
        1.0 / length(vec2(obLocS.y, obLocS.z)),
        1.0 / length(vec2(obLocS.x, obLocS.z))
      );
      float shObCov = boxOccLocal3D(obLocP, obLocS, vec3(0.0, 0.396, 0.0), vec3(0.235, 0.006, 0.168), 0.004, 0.016, obInvHyp);
      float shObPgs = boxOccLocal3D(obLocP, obLocS, vec3(0.0, 0.408, 0.0), vec3(0.222, 0.010, 0.158), 0.004, 0.016, obInvHyp);
      float shObook = max(shObCov, shObPgs) * 0.91;

      vec2 vaseC = vec2(0.44, 1.98) + u_tableParams.xy;
      float shOvaseBelly = rayEllipsoidShadow(p, vec3(vaseC.x, 0.495, vaseC.y), vec3(0.088, 0.105, 0.088), s, 0.004, 0.022, 1.028);
      bool isOvaseNeckSelf = (p.y > 0.562 && p.y < 0.648 && length(p.xz - vaseC) < 0.050);
      float shOvaseNeck = rayCylYShadow(p, vaseC, 0.565, 0.645, 0.044, s, 0.004, 0.024, isOvaseNeckSelf);
      float shCarafeCollar = rayCylYShadow(p, u_bookCarafePos.zw, 0.628, 0.672, 0.0405, s, 0.005, 0.024, false) * 0.88;
      float shOvase = max(max(shOvaseBelly, shOvaseNeck), shCarafeCollar) * 0.90;

      stillLifeShadow = max(max(shCupBody, shSaucer), max(shOvase, max(shCbook, shObook)));
    }

    float chairShadow = 0.0;
    if (p.y < 0.85 && p.x > u_chairBase.x - 1.55 && p.x < u_chairBase.x + 0.95 && p.z > u_chairBase.z - 1.15 && p.z < u_chairBase.z + 1.05) {
      float chx = p.x - u_chairBase.x;
      float chz = p.z - u_chairBase.z;
      vec3 locP = vec3(
        u_chairRot.y * chx + u_chairRot.z * chz,
        p.y,
        -u_chairRot.z * chx + u_chairRot.y * chz
      );
      vec3 locS = vec3(
        u_chairRot.y * s.x + u_chairRot.z * s.z,
        s.y,
        -u_chairRot.z * s.x + u_chairRot.y * s.z
      );
      vec3 locInvHyp = vec3(
        1.0 / length(vec2(locS.x, locS.y)),
        1.0 / length(vec2(locS.y, locS.z)),
        1.0 / length(vec2(locS.x, locS.z))
      );
      float chSeat = boxOccLocal3D(locP, locS, vec3(0.0, 0.215, -0.02), vec3(0.41, 0.165, 0.395), 0.018, 0.026, locInvHyp) * 0.94;
      float chBack = boxOccLocal3D(locP, locS, vec3(0.0, 0.565, 0.312), vec3(0.40, 0.275, 0.085), 0.018, 0.026, locInvHyp) * 0.94;
      float chArmL = boxOccLocal3D(locP, locS, vec3(-0.425, 0.465, -0.01), vec3(0.028, 0.025, 0.245), 0.018, 0.026, locInvHyp) * 0.90;
      float chArmR = boxOccLocal3D(locP, locS, vec3(0.425, 0.465, -0.01), vec3(0.028, 0.025, 0.245), 0.018, 0.026, locInvHyp) * 0.90;
      float chairBoxSh = max(max(chSeat, chBack), max(chArmL, chArmR));

      float chairLegSh = 0.0;
      if (p.y < 0.38) {
        float dSegMin = 10.0;
        for (int i = 0; i < 8; i++) {
          vec3 a3 = u_chairSteelA[i];
          vec3 b3 = u_chairSteelB[i];
          vec2 aProj = a3.xz - max(a3.y - p.y, 0.0) * sunSl;
          vec2 bProj = b3.xz - max(b3.y - p.y, 0.0) * sunSl;
          vec2 ab = bProj - aProj;
          vec2 ap = p.xz - aProj;
          float tSeg = clamp(dot(ap, ab) / max(dot(ab, ab), 1e-8), 0.0, 1.0);
          dSegMin = min(dSegMin, length(ap - tSeg * ab));
        }
        chairLegSh = (1.0 - smoothstepCpu(0.010, 0.028, dSegMin)) * 0.91;
      }
      chairShadow = max(chairBoxSh, chairLegSh);
    }

    float benchShadow = 0.0;
    if (p.y < 0.528 && p.z > 5.85) {
      float occCab = boxOcc3D(p, vec3(u_benchParams.x, 0.290, 7.23), vec3(u_benchParams.y - 0.02, 0.205, 0.33), 0.014, 0.024, invHyp) * 0.95;
      float occSlab = boxOcc3D(p, vec3(u_benchParams.x, 0.5105, 7.22), vec3(u_benchParams.y, 0.0165, 0.35), 0.015, 0.024, invHyp) * 0.95;
      float occPlinth = boxOcc3D(p, vec3(u_benchParams.x, 0.0425, 7.25), vec3(u_benchParams.y - 0.08, 0.0425, 0.28), 0.010, 0.020, invHyp) * 0.96;
      benchShadow = max(max(occCab, occSlab), occPlinth);
      if (p.y < 0.095) {
        float legLf = boxOcc3D(p, vec3(u_benchParams.z, 0.045, 6.96), vec3(0.018, 0.045, 0.018), 0.008, 0.016, invHyp) * 0.92;
        float legRf = boxOcc3D(p, vec3(u_benchParams.w, 0.045, 6.96), vec3(0.018, 0.045, 0.018), 0.008, 0.016, invHyp) * 0.92;
        float legLb = boxOcc3D(p, vec3(u_benchParams.z, 0.045, 7.46), vec3(0.018, 0.045, 0.018), 0.008, 0.016, invHyp) * 0.92;
        float legRb = boxOcc3D(p, vec3(u_benchParams.w, 0.045, 7.46), vec3(0.018, 0.045, 0.018), 0.008, 0.016, invHyp) * 0.92;
        benchShadow = max(benchShadow, max(max(legLf, legRf), max(legLb, legRb)));
      }
    }
    if ((p.y > 0.515 && p.y < 0.530 && p.z > 6.85) || (p.z > 7.56 && p.y > 0.52 && p.y < 1.38)) {
      float credDx = u_benchParams.x + 0.85;
      float bScaleX = u_benchParams.y / 1.70;
      vec2 v1Center = vec2(0.22 * bScaleX + credDx, 7.16);
      float dhV1 = clamp(0.84 - p.y, 0.005, 0.32);
      vec2 sv1 = -dhV1 * sunSl;
      vec2 rv1 = p.xz - v1Center;
      float tv1 = clamp(dot(rv1, sv1) / max(dot(sv1, sv1), 1e-8), 0.0, 1.0);
      float dv1 = length(rv1 - tv1 * sv1);
      float shV1 = (p.y > 0.531 && length(rv1) < 0.118) ? 0.0 : (1.0 - smoothstepCpu(0.098, 0.122, dv1)) * 0.86;

      vec2 v2Center = vec2(0.46 * bScaleX + credDx, 7.22);
      float dhV2 = clamp(0.65 - p.y, 0.005, 0.13);
      vec2 sv2 = -dhV2 * sunSl;
      vec2 rv2 = p.xz - v2Center;
      float tv2 = clamp(dot(rv2, sv2) / max(dot(sv2, sv2), 1e-8), 0.0, 1.0);
      float dv2 = length(rv2 - tv2 * sv2);
      float shV2 = (p.y > 0.531 && length(rv2) < 0.066) ? 0.0 : (1.0 - smoothstepCpu(0.050, 0.070, dv2)) * 0.84;

      float shFolio = boxOcc3D(p, vec3(-0.52 * bScaleX + credDx, 0.559, 7.18), vec3(0.21, 0.032, 0.16), 0.006, 0.018, invHyp) * 0.88;
      float shArt = boxOcc3D(p, vec3(-1.58 * bScaleX + credDx, 1.086, 7.24), vec3(0.48 * bScaleX, 0.56, 0.022), 0.008, 0.020, invHyp) * 0.90;
      benchShadow = max(benchShadow, max(max(shV1, shV2), max(shFolio, shArt)));
    }

    return sunVis * (1.0 - tableShadow) * (1.0 - stillLifeShadow) * (1.0 - chairShadow) * (1.0 - benchShadow);
  }

  struct MatOut {
    vec3 albedo;
    float rough;
    vec3 n;
    vec2 aniso;
  };

  vec3 valueNoise2dGrad(float x, float y, int seed) {
    int ox = (seed * 173 + 37) & 1023;
    int oy = (seed * 293 + 91) & 1023;
    float xf = floor(x);
    float yf = floor(y);
    float fx = x - xf;
    float fy = y - yf;
    float ux = fx * fx * fx * (fx * (fx * 6.0 - 15.0) + 10.0);
    float uy = fy * fy * fy * (fy * (fy * 6.0 - 15.0) + 10.0);
    float dux = 30.0 * fx * fx * (fx - 1.0) * (fx - 1.0);
    float duy = 30.0 * fy * fy * (fy - 1.0) * (fy - 1.0);

    int ix0 = (int(xf) + ox) & 1023;
    int iy0 = (int(yf) + oy) & 1023;
    int ix1 = (ix0 + 1) & 1023;
    int iy1 = (iy0 + 1) & 1023;

    float c00 = texelFetch(u_randTex, ivec2(ix0, iy0), 0).r;
    float c10 = texelFetch(u_randTex, ivec2(ix1, iy0), 0).r;
    float c01 = texelFetch(u_randTex, ivec2(ix0, iy1), 0).r;
    float c11 = texelFetch(u_randTex, ivec2(ix1, iy1), 0).r;

    float k1 = c10 - c00;
    float k2 = c01 - c00;
    float k3 = c11 - c10 - c01 + c00;
    float val = c00 + ux * k1 + uy * (k2 + ux * k3);
    float dvdx = dux * (k1 + uy * k3);
    float dvdy = duy * (k2 + ux * k3);
    return vec3(val, dvdx, dvdy);
  }

  MatOut materialWovenBoucleRugScalar(vec3 p, vec3 nIn, bool isBorder, bool fastMode) {
    MatOut m;
    m.aniso = vec2(0.0);
    float fx = p.x;
    float fz = p.z;
    if (fastMode) {
      float macroW = valueNoise2d(fx * 6.0, fz * 6.0, 751);
      m.albedo = isBorder
        ? vec3(0.44, 0.385, 0.315)
        : vec3(0.585, 0.535, 0.455) * (0.92 + 0.14 * macroW);
      m.rough = 0.82;
      m.n = nIn;
      return m;
    }

    float dzDist = max(fz - 0.95, 0.0);
    float aa1 = 1.0 / (1.0 + 0.14 * dzDist * dzDist);
    float aa2 = 1.0 / (1.0 + 0.38 * dzDist * dzDist);

    vec3 nKnot = valueNoise2dGrad(fx * 56.0 + fz * 5.0, fz * 50.0 - fx * 4.5, 761);
    vec3 nTwist = valueNoise2dGrad(fx * 112.0 - fz * 11.0, fz * 98.0 + fx * 9.5, 769);
    float fineFleck = valueNoise2d(fx * 185.0 + 1.7, fz * 165.0 - 2.3, 773);

    float weftPhase = fz * 168.0 + 0.55 * sin(fx * 8.5) + (nKnot.x - 0.5) * 1.25;
    float weftRib = 0.5 + 0.5 * sin(weftPhase);
    float warpRib = 0.5 + 0.5 * sin(fx * 84.0 + (nTwist.x - 0.5) * 1.1);

    float bKnot = 1.0 - abs(2.0 * nKnot.x - 1.0);
    float bTwist = 1.0 - abs(2.0 * nTwist.x - 1.0);
    float loopDome = clamp(
      0.38 * weftRib * aa2 +
      0.38 * bKnot * aa1 +
      0.16 * bTwist * aa2 +
      0.08 * warpRib * aa2,
      0.0, 1.0
    );

    float slubBand = valueNoise2d(fx * 5.5, fz * 42.0, 787);
    float macroPatina = fbm2d(fx * 1.5, fz * 1.5, 2, 793);

    vec3 woolEcru = vec3(0.635, 0.585, 0.498);
    vec3 woolOatmeal = vec3(0.535, 0.480, 0.398);
    vec3 woolFlaxFleck = vec3(0.395, 0.345, 0.275);

    float yarnMix = clamp(0.45 * nKnot.x + 0.35 * slubBand + 0.20 * fineFleck, 0.0, 1.0);
    float fleckW = ((fineFleck > 0.84 && nTwist.x > 0.58) ? 1.0 : 0.0) * aa1;
    vec3 yarnCol = mix(woolOatmeal, woolEcru, yarnMix);
    yarnCol = mix(yarnCol, woolFlaxFleck, 0.28 * fleckW);

    float chDx = fx - u_chairBase.x;
    float chDz = fz - u_chairBase.z;
    float lcxR = u_chairRot.y * chDx + u_chairRot.z * chDz;
    float lczR = -u_chairRot.z * chDx + u_chairRot.y * chDz;
    float signedDxRun = (abs(lcxR) - 0.425) * sign(lcxR);
    float alongRun = 1.0 - smoothstepCpu(0.365, 0.415, abs(lczR - 0.005));
    float dRunAbs = abs(abs(lcxR) - 0.425);
    float troughDarken = 1.0 - 0.38 * alongRun * exp(-((dRunAbs / 0.020) * (dRunAbs / 0.020)));
    float pileSlopeLocalX = alongRun * (signedDxRun / 0.018) * exp(-((dRunAbs / 0.022) * (dRunAbs / 0.022))) * 0.28;
    float nxTrough = u_chairRot.y * pileSlopeLocalX;
    float nzTrough = u_chairRot.z * pileSlopeLocalX;

    vec3 boucleAlb = yarnCol *
      (0.77 + 0.33 * loopDome) *
      (0.96 + 0.07 * macroPatina) *
      troughDarken;

    float twillWave = (0.5 + 0.5 * sin((fx + fz) * 145.0)) * aa2;
    vec3 borderAlb = vec3(0.44, 0.385, 0.315) * (0.90 + 0.16 * twillWave);

    m.albedo = isBorder ? borderAlb : boucleAlb;

    float dWeftSlope = cos(weftPhase) * 0.135 * aa2;
    float nxWool = (nKnot.y * 0.22 * aa1 + nTwist.y * 0.14 * aa2) + nxTrough;
    float nzWool = (dWeftSlope + nKnot.z * 0.22 * aa1 + nTwist.z * 0.14 * aa2) + nzTrough;
    float nxLoop = isBorder ? (twillWave - 0.25) * 0.08 : nxWool;
    float nzLoop = isBorder ? -(twillWave - 0.25) * 0.08 : nzWool;
    m.n = normalize(nIn + vec3(nxLoop, 0.0, nzLoop));
    m.rough = isBorder ? 0.68 : clamp(0.76 + 0.12 * (1.0 - loopDome), 0.70, 0.90);
    return m;
  }

  MatOut materialBoardFormedConcreteScalar(vec3 p, vec3 nIn, bool isCeiling, bool fastMode) {
    MatOut m;
    float uCoord = isCeiling ? p.x : (p.x - u_roomXLeft);
    float vCoord = isCeiling ? p.z : p.y;
    float panelW = isCeiling ? 1.55 : u_concretePanelW;
    float panelH = isCeiling ? 1.85 : 1.0625;
    float boardH = isCeiling ? 0.205 : 0.2125;

    float boardIdx = floor(vCoord / boardH);
    float panelUIdx = floor(uCoord / panelW);
    float panelVIdx = floor(vCoord / panelH);

    float boardHash = hash2d(int(boardIdx), int(panelUIdx), 501);
    float boardTint = 0.93 + 0.13 * boardHash;

    float uLocalBoard = uCoord * 2.2 + boardHash * 11.3;
    float vLocalBoard = (vCoord / boardH - boardIdx) * 6.0;
    float grainF = fbm2d(uLocalBoard * 1.4, vLocalBoard * 5.2, fastMode ? 1 : 3, 509);
    float cathedral = sin(vLocalBoard * 4.5 + grainF * 6.5) * 0.5 + 0.5;
    float finePores = fastMode ? 0.5 : valueNoise2d(uCoord * 38.0, vCoord * 38.0, 521);
    float microSpall = fastMode ? 0.5 : valueNoise2d(uCoord * 92.0, vCoord * 92.0, 537);

    float gMult = 0.62 + 0.38 * grainF;
    float cMult = cathedral * 0.38;
    vec3 alb = vec3(
      0.41 * gMult + 0.04 * cMult,
      0.40 * gMult + 0.02 * cMult,
      0.38 * gMult
    ) * boardTint;

    if (!fastMode) {
      float pitMask = smoothstepCpu(0.84, 0.95, microSpall);
      float pMult = (0.93 + 0.12 * finePores) * (1.0 - 0.18 * pitMask);
      alb *= pMult;
    }

    float vFrac = abs(vCoord / boardH - floor(vCoord / boardH + 0.5)) * boardH;
    float uFrac = abs(uCoord / panelW - floor(uCoord / panelW + 0.5)) * panelW;
    float pvFrac = abs(vCoord / panelH - floor(vCoord / panelH + 0.5)) * panelH;

    float boardSeam = 1.0 - 0.32 * (1.0 - smoothstepCpu(0.0, 0.0048, vFrac));
    float panelSeam = 1.0 - 0.52 * (1.0 - min(smoothstepCpu(0.0, 0.0068, uFrac), smoothstepCpu(0.0, 0.0068, pvFrac)));
    alb *= boardSeam * panelSeam;

    vec3 outN = nIn;
    float seamSlopeV = sin((vCoord / boardH) * 2.0 * PI) * exp(-((vFrac / 0.006) * (vFrac / 0.006))) * 0.16;
    float grainSlope = (cathedral - 0.5) * 0.042;

    if (!isCeiling && !fastMode) {
      float pu = uCoord - panelUIdx * panelW;
      float pv = vCoord - panelVIdx * panelH;
      float c0 = 0.22 * panelW, c1 = 0.50 * panelW, c2 = 0.78 * panelW;
      float r0 = 0.26 * panelH, r1 = 0.74 * panelH;
      float d0 = abs(pu - c0), d1 = abs(pu - c1), d2 = abs(pu - c2);
      float colC = (d0 <= d1 && d0 <= d2) ? c0 : (d1 <= d2 ? c1 : c2);
      float rowC = abs(pv - r0) <= abs(pv - r1) ? r0 : r1;
      float vecU = pu - colC;
      float vecV = pv - rowC;
      float rHole = length(vec2(vecU, vecV));
      float coneOuterR = 0.024;
      float coneInnerR = 0.011;
      bool inCone = rHole < coneOuterR;
      bool inPlug = rHole < coneInnerR;
      float coneAo = inPlug ? 0.22 : (inCone ? (0.48 + 0.52 * ((rHole - coneInnerR) / (coneOuterR - coneInnerR))) : 1.0);
      alb *= coneAo;
      float bevelStrength = (inCone && !inPlug) ? 0.65 : 0.0;
      float invR = 1.0 / max(rHole, 1e-5);
      outN.x += -vecU * invR * bevelStrength;
      outN.y += -vecV * invR * bevelStrength + seamSlopeV + grainSlope;
    } else {
      outN.z += seamSlopeV + grainSlope;
    }

    m.albedo = alb;
    m.rough = clamp(0.34 + 0.12 * (1.0 - grainF) - 0.06 * cathedral, 0.22, 0.55);
    m.n = normalize(outN);
    m.aniso = vec2(0.0);
    return m;
  }

  MatOut materialOiledOakAndTravertineFloorScalar(float fx, float fz, bool isTravertineZone) {
    MatOut m;
    if (isTravertineZone) {
      float travBand = fbm2d(fx * 2.2 + sin(fz * 1.7) * 0.4, fz * 0.95, 3, 701);
      float travVein = 0.5 + 0.5 * sin(fx * 6.5 + travBand * 7.2 + fz * 1.4);
      float travPores = valueNoise2d(fx * 42.0, fz * 16.0, 719);
      float porePit = smoothstepCpu(0.76, 0.90, travPores) * smoothstepCpu(0.35, 0.75, travVein);
      float vMult = 0.55 + 0.45 * travVein;
      float oMult = 0.45 * (1.0 - travVein);
      float bMult = (0.93 + 0.12 * travBand) * (1.0 - 0.35 * porePit);
      float jointX = abs(fx / 0.90 - floor(fx / 0.90 + 0.5)) * 0.90;
      float jointZ = abs(fz / 1.20 - floor(fz / 1.20 + 0.5)) * 1.20;
      float stoneJoint = smoothstepCpu(0.0, 0.0035, min(jointX, jointZ));
      float jMult = bMult * (0.42 + 0.58 * stoneJoint);
      m.albedo = (vec3(0.56, 0.50, 0.41) * vMult + vec3(0.44, 0.37, 0.29) * oMult) * jMult;
      float rough = clamp(0.095 + 0.055 * (1.0 - travVein) + 0.22 * porePit, 0.08, 0.38);
      m.rough = rough;
      m.aniso = vec2(rough * 0.75, rough * 1.65);
      float travNx = (travBand - 0.5) * 0.012;
      m.n = normalize(vec3(travNx, 1.0, 0.0));
      return m;
    }

    float plankW = 0.23;
    float plankIdx = floor((fx + 4.0) / plankW);
    float uPlank = (fx + 4.0) / plankW - plankIdx;
    float plankOffset = hash2d(int(plankIdx), 0, 601) * 2.4;
    float plankZIdx = floor((fz + plankOffset) / 2.4);
    float vPlank = (fz + plankOffset) / 2.4 - plankZIdx;

    float idHash = hash2d(int(plankIdx), int(plankZIdx), 607);
    float ringCenterU = 0.25 + 0.50 * hash2d(int(plankIdx), int(plankZIdx), 613);
    float grainWarp = fbm2d(fx * 5.5 + idHash * 7.0, fz * 1.4, 2, 619);
    float du = (uPlank - ringCenterU) * 14.0;
    float ringPhase = du * du + fz * 2.6 + grainWarp * 5.8;
    float rings = 0.5 + 0.5 * sin(ringPhase);
    float ringsSharp = pow(rings, 1.8);

    float fineFiber = valueNoise2d(fx * 85.0, fz * 14.0, 631);
    float plankTone = 0.82 + 0.34 * idHash;
    float lMult = (1.0 - 0.52 * ringsSharp) * plankTone;
    float dMult = 0.52 * ringsSharp * plankTone;
    float fMult = 0.90 + 0.18 * fineFiber;
    float wMult = 0.08 * grainWarp;

    float edgeU = min(uPlank, 1.0 - uPlank) * plankW;
    float edgeV = min(vPlank, 1.0 - vPlank) * 2.4;
    float grooveU = smoothstepCpu(0.0, 0.0045, edgeU);
    float grooveV = smoothstepCpu(0.0, 0.0055, edgeV);
    float grooveMask = grooveU * grooveV;
    float gMult = 0.28 + 0.72 * grooveMask;

    m.albedo = ((vec3(0.38, 0.25, 0.14) * lMult + vec3(0.20, 0.12, 0.065) * dMult) * fMult + vec3(0.44, 0.28, 0.15) * wMult) * gMult;
    float rough = clamp(0.115 + 0.065 * ringsSharp + 0.035 * (1.0 - idHash) + 0.25 * (1.0 - grooveMask), 0.085, 0.42);
    m.rough = rough;
    m.aniso = vec2(rough * 0.75, rough * 1.65);
    float bevelNx = (uPlank < 0.03 ? -1.0 : (uPlank > 0.97 ? 1.0 : 0.0)) * (1.0 - grooveU) * 0.22;
    float fiberNx = (fineFiber - 0.5) * 0.016;
    m.n = normalize(vec3(bevelNx + fiberNx, 1.0, 0.0));
    return m;
  }

  MatOut materialAmericanWalnutScalar(vec3 p, vec3 nIn, bool fastMode) {
    MatOut m;
    float u = p.z * 3.5 + p.x * 2.0;
    float v = p.y * 2.8;
    float wNoise = fastMode ? valueNoise2d(u, v, 809) : fbm2d(u, v, 3, 809);
    float grain = 0.5 + 0.5 * sin(u * 8.5 + wNoise * 6.8);
    float nMult = 0.90 + 0.20 * wNoise;
    m.albedo = mix(vec3(0.11, 0.058, 0.032), vec3(0.24, 0.135, 0.072), grain) * nMult;
    m.rough = clamp(0.20 + 0.10 * (1.0 - grain), 0.16, 0.34);
    m.n = nIn;
    m.aniso = vec2(0.0);
    return m;
  }

  struct RayHit {
    float t;
    vec3 p;
    vec3 n;
    int matId;
    vec3 albedo;
    float rough;
    vec3 f0;
    float metallic;
    vec2 uv;
  };

  float computeAnalyticAoScalar(vec3 p, float ny, int matId) {
    float caseFrontActive = -2.72 + u_leftWallShiftX;
    float dFloor = saturate(p.y / 0.38);
    float dCeil = saturate((u_roomYCeil - p.y) / 0.45);
    float dBack = saturate((u_roomZBack - p.z) / 0.45);
    float dLeft = saturate((p.x - caseFrontActive) / 0.42);

    float cornerAo =
      (0.74 + 0.26 * sqrt(dFloor * dBack)) *
      (0.76 + 0.24 * sqrt(dCeil * dBack)) *
      (0.72 + 0.28 * sqrt(max(0.0, dLeft) * dFloor));
    float alcoveDepth = saturate((caseFrontActive - p.x) / 0.38);
    float alcoveAo = 1.0 - 0.52 * pow(alcoveDepth, 1.2);

    float floorAo = 1.0;
    if (p.y < 0.026) {
      float tabCx = 0.33 + u_tableParams.x;
      float tabCz = 1.77 + u_tableParams.y;
      float rPed = length(vec2(p.x - tabCx, p.z - tabCz));
      float aoPed = 0.22 + 0.78 * smoothstepCpu(0.308, 0.46, rPed);

      float dxTab = max(abs(p.x - tabCx) - u_tableParams.w, 0.0);
      float dzTab = max(abs(p.z - tabCz) - 0.52, 0.0);
      float aoCanopy = 0.74 + 0.26 * smoothstepCpu(0.0, 0.24, length(vec2(dxTab, dzTab)));
      float aoUnderTable = aoPed * aoCanopy;

      float chDx = p.x - u_chairBase.x;
      float chDz = p.z - u_chairBase.z;
      float rChair = length(vec2(chDx, chDz));
      float lcxAo = u_chairRot.y * chDx + u_chairRot.z * chDz;
      float lczAo = -u_chairRot.z * chDx + u_chairRot.y * chDz;
      float dRunnerAo = length(vec2(abs(abs(lcxAo) - 0.425), max(abs(lczAo - 0.005) - 0.382, 0.0)));
      float aoRunners = (0.07 + 0.93 * smoothstepCpu(0.008, 0.030, dRunnerAo)) *
                        (0.64 + 0.36 * smoothstepCpu(0.012, 0.075, dRunnerAo));
      float aoUnderChair = (0.30 + 0.70 * smoothstepCpu(0.18, 0.64, rChair)) * aoRunners;

      float dxBn = max(abs(p.x - u_benchParams.x) - (u_benchParams.y - 0.03), 0.0);
      float dzBn = max(abs(p.z - 7.22) - 0.32, 0.0);
      float aoUnderBench = 0.34 + 0.66 * smoothstepCpu(0.0, 0.28, length(vec2(dxBn, dzBn)));

      float aoRugEdge = 1.0;
      if (p.y < 0.004) {
        float rugMinX = u_rugX.x;
        float rugMaxX = u_rugX.y;
        float rugMinZ = 0.48 + 0.5 * u_tableParams.y;
        float rugMaxZ = 3.92 + 0.5 * u_tableParams.y;
        float dxRug = max(max(rugMinX - p.x, p.x - rugMaxX), 0.0);
        float dzRug = max(max(rugMinZ - p.z, p.z - rugMaxZ), 0.0);
        float dRugEdge = length(vec2(dxRug, dzRug));
        if (dRugEdge > 0.0 && dRugEdge < 0.065) {
          aoRugEdge = 0.44 + 0.56 * smoothstepCpu(0.0, 0.060, dRugEdge);
        }
      }
      floorAo = aoUnderTable * aoUnderChair * aoUnderBench * aoRugEdge;
    }

    float tableAo = 1.0;
    if (matId == MAT_COFFEE_TABLE_TOP) {
      if (ny > 0.8) {
        float tabDx = u_tableParams.x;
        float tabDz = u_tableParams.y;
        float rVase = length(vec2(p.x - (0.44 + tabDx), p.z - (1.98 + tabDz)));
        float aoVase = 0.18 + 0.82 * smoothstepCpu(0.055, 0.135, rVase);
        float rSaucer = length(vec2(p.x - (0.24 + tabDx), p.z - (1.82 + tabDz)));
        float aoCup = 0.22 + 0.78 * smoothstepCpu(0.062, 0.125, rSaucer);
        float rCarafe = length(vec2(p.x - u_bookCarafePos.z, p.z - u_bookCarafePos.w));
        float aoCarafe = 0.24 + 0.76 * smoothstepCpu(0.048, 0.115, rCarafe);
        float rTumbler = length(vec2(p.x - u_tumblerPos.x, p.z - u_tumblerPos.y));
        float aoTumbler = 0.22 + 0.78 * smoothstepCpu(0.048, 0.095, rTumbler);
        float bxL = BOOK_COS_019 * (p.x - u_bookCarafePos.x) + BOOK_SIN_019 * (p.z - u_bookCarafePos.y);
        float bzL = -BOOK_SIN_019 * (p.x - u_bookCarafePos.x) + BOOK_COS_019 * (p.z - u_bookCarafePos.y);
        float dBook = length(max(abs(vec2(bxL, bzL)) - vec2(0.23, 0.165), vec2(0.0)));
        float aoBook = 0.22 + 0.78 * smoothstepCpu(0.0, 0.055, dBook);
        float dStack = length(max(abs(vec2(p.x - (-0.12 + tabDx), p.z - (2.04 + tabDz))) - vec2(0.155, 0.215), vec2(0.0)));
        float aoStack = 0.22 + 0.78 * smoothstepCpu(0.0, 0.055, dStack);
        tableAo = aoVase * aoCup * aoCarafe * aoTumbler * aoBook * aoStack;
      } else if (ny < -0.5) {
        tableAo = 0.18;
      }
    }
    return cornerAo * alcoveAo * floorAo * tableAo;
  }

  vec4 vesselCausticPatternScalar(vec2 pxz, vec2 vxz, float radius, float focalDist, vec3 tc, vec3 tb, float intensity) {
    vec2 rel = pxz - vxz;
    float uAlong = rel.x * u_sunHorizPerp.x + rel.y * u_sunHorizPerp.y;
    float vPerp = rel.x * u_sunHorizPerp.z + rel.y * u_sunHorizPerp.w;
    float uN = uAlong / focalDist;
    float vN = vPerp / radius;
    float ellR = length(vec2((uAlong - 0.85 * focalDist) / (1.35 * focalDist), vPerp / (1.05 * radius)));
    float umbra = 1.0 - 0.62 * (1.0 - smoothstepCpu(0.45, 1.15, ellR));
    float inDownstream = smoothstepCpu(0.08, 0.32, uN) * (1.0 - smoothstepCpu(1.65, 2.35, uN));
    if (inDownstream <= 1e-6) return vec4(0.0, 0.0, 0.0, umbra);

    float envelopeW = max(0.08, 0.78 * sqrt(clamp(1.55 - uN * 0.72, 0.0, 2.0)));
    float edgeDist = abs(abs(vN) - envelopeW * 0.68);
    float edNorm = edgeDist / 0.14;
    float causticArc = exp(-edNorm * edNorm) * inDownstream;
    float cuX = (uN - 1.02) / 0.28;
    float cuY = vN / 0.24;
    float cuspFocus = exp(-(cuX * cuX + cuY * cuY)) * 1.85;
    float stY = vN / (envelopeW + 0.15);
    float striation = (0.55 + 0.45 * cos(uN * 18.0 - vN * vN * 6.5)) * exp(-stY * stY) * inDownstream;
    float doY = (abs(vN) - envelopeW * 0.76) / 0.09;
    float dispOuter = exp(-doY * doY) * inDownstream;

    float coreW = causticArc + cuspFocus;
    float bodyW = striation * 0.55;
    float dispW = dispOuter * 0.45;
    vec3 cCol = (coreW * tc + bodyW * tb + dispW * vec3(1.55, 0.95, 0.35)) * intensity;
    return vec4(cCol, umbra);
  }

  vec3 evalSconceLight(vec3 p, vec3 n, vec3 v, float nDotVSky, vec3 alb, float rgh, vec3 f0, float met, vec3 scPos, vec3 scRad, float attBase, float attScale, float coneLow, float coneHigh) {
    vec3 ts = scPos - p;
    float dist2 = max(dot(ts, ts), 0.015);
    float distSc = sqrt(dist2);
    vec3 ds = ts / distSc;
    float attSc = 1.0 / (attBase + attScale * dist2);
    float coneSc = smoothstepCpu(coneLow, coneHigh, -ds.y);
    float scWeight = attSc * coneSc;
    if (scWeight <= 1e-5) return vec3(0.0);

    vec3 scH = normalize(v + ds);
    float nDotLSc = saturate(dot(n, ds));
    float nDotHSc = saturate(dot(n, scH));
    float vDotHSc = saturate(dot(v, scH));
    float dSc = ggxIsotropicD(nDotHSc, rgh);
    float gSc = smithGgxG(nDotVSky, nDotLSc, rgh);
    vec3 fSc = vec3(
      schlickFresnelScalar(vDotHSc, f0.r),
      schlickFresnelScalar(vDotHSc, f0.g),
      schlickFresnelScalar(vDotHSc, f0.b)
    );
    float specScBase = dSc * gSc * nDotLSc;
    float diffScScale = (1.0 - met) * INV_PI * nDotLSc;
    return ((vec3(1.0) - fSc) * diffScScale * alb + specScBase * fSc) * scRad * scWeight;
  }

  vec3 shadeSurfaceScalar(RayHit hit, vec3 rd, bool isSecondary) {
    int matId = hit.matId;
    vec3 p = hit.p;
    vec3 n = hit.n;
    vec3 v = -rd;

    if (matId == MAT_WINDOW_GLASS) {
      vec3 ext = evaluateExteriorCourtyardScalar(p, rd);
      float cosV = saturate(dot(n, v));
      float fGlass = dielectricFresnelExact(cosV, 1.0, 1.52);
      float trans = 1.0 - 0.85 * fGlass;
      return ext * trans + fGlass * vec3(0.42, 0.30, 0.18);
    }
    if (matId == MAT_SCONCE_BULB) {
      return u_sconceBulbEmit;
    }

    vec3 alb = hit.albedo;
    float rgh = hit.rough;
    vec3 f0 = hit.f0;
    float met = hit.metallic;

    float ao = computeAnalyticAoScalar(p, n.y, matId);
    float sunVis = evaluateWindowSunTransmissionScalar(p);
    float sunVisEff = sunVis;
    vec3 caust = vec3(0.0);

    if (!isSecondary && (matId == MAT_COFFEE_TABLE_TOP || matId == MAT_OPEN_BOOK_PAGE || matId == MAT_OPEN_BOOK_COVER || matId == MAT_SILK_RIBBON) && n.y > 0.5) {
      float fStretch = clamp(0.295 / max(u_sunDir.y, 0.14), 0.78, 1.48);
      vec4 c1 = vesselCausticPatternScalar(p.xz, u_bookCarafePos.zw, 0.088, 0.22 * fStretch, vec3(5.8, 16.5, 6.8), vec3(3.8, 10.8, 4.4), 1.18);
      vec4 c2 = vesselCausticPatternScalar(p.xz, u_tumblerPos, 0.045, 0.14 * fStretch, vec3(17.2, 16.8, 16.2), vec3(9.8, 9.6, 9.2), 1.12);
      sunVisEff = sunVis * c1.w * c2.w;
      caust = alb * (c1.rgb + c2.rgb) * (sunVis * INV_PI);
    }

    vec3 direct = vec3(0.0);
    if (sunVisEff > 1e-6) {
      vec3 h = normalize(v + u_sunDir);
      float nDotL = saturate(dot(n, u_sunDir));
      float nDotV = clamp(dot(n, v), 1e-4, 1.0);
      float nDotH = saturate(dot(n, h));
      float vDotH = saturate(dot(v, h));

      float dTerm = ggxIsotropicD(nDotH, rgh);
      float gTerm = smithGgxG(nDotV, nDotL, rgh);
      vec3 f = vec3(
        schlickFresnelScalar(vDotH, f0.r),
        schlickFresnelScalar(vDotH, f0.g),
        schlickFresnelScalar(vDotH, f0.b)
      );
      float specBase = dTerm * gTerm * nDotL;
      float oneMinusMet = (1.0 - met) * INV_PI * nDotL;
      vec3 tot = (vec3(1.0) - f) * oneMinusMet * alb + specBase * f;
      direct = tot * u_sunRadiance * sunVisEff;

      if (matId == MAT_EUCALYPTUS_LEAF) {
        float backlit = saturate(-dot(n, u_sunDir));
        direct += backlit * sunVisEff * vec3(1.65, 2.45, 0.95);
      } else if (matId == MAT_LEATHER_CHAIR) {
        float rawNL = dot(n, u_sunDir);
        float nDotLCh = saturate(rawNL);
        float wrapLth = saturate((rawNL + 0.35) / 1.35);
        float sssW = (wrapLth - nDotLCh) * sunVisEff;
        direct += sssW * vec3(1.25, 0.38, 0.08);
      }
    }
    if (matId == MAT_BOUCLE_RUG || matId == MAT_RUG_LINEN_BORDER || matId == MAT_BOOK_SPINE) {
      float cosNvTx = saturate(dot(n, v));
      float cosNlTx = saturate(dot(n, u_sunDir));
      float grazingFiber = pow(1.0 - cosNvTx, 3.2) * (0.25 + 0.75 * cosNlTx);
      vec3 sheenTint = (matId == MAT_BOOK_SPINE) ? (alb * 0.55 + 0.12) : vec3(0.86, 0.80, 0.70);
      direct += grazingFiber * sheenTint * (0.28 + 0.72 * sunVisEff);
    }

    float distRightWin = max(u_roomXRight - p.x, 0.35);
    vec3 sr = normalize(vec3(0.86, 0.36 - 0.07 * p.y, 0.22 - 0.03 * p.z));
    float formRight = (1.0 / (1.0 + 0.11 * distRightWin * distRightWin)) * (0.45 + 0.55 * saturate(dot(n, sr)));

    float backWinCenterX = 0.5 * (u_backConcreteXMax + u_roomXRight) + 0.01;
    float distBackWin = length(vec2(max(p.x - backWinCenterX, 0.0), max(u_roomZBack - p.z, 0.45)));
    vec3 sb = normalize(vec3((backWinCenterX - p.x) * 0.25, 0.28 - 0.05 * p.y, 1.0));
    float formBack = (0.65 / (1.0 + 0.10 * distBackWin * distBackWin)) * (0.35 + 0.65 * saturate(dot(n, sb)));

    float skyIrrScale = 1.0 - 0.18 * u_duskFactor + 0.12 * u_highSunFactor;
    vec3 skyIrr = vec3(
      (formRight * 0.82 + formBack * 0.68) * ao * (skyIrrScale + 0.10 * u_duskFactor),
      (formRight * 1.02 + formBack * 0.84) * ao * skyIrrScale,
      (formRight * 1.38 + formBack * 1.12) * ao * (skyIrrScale - 0.08 * u_duskFactor)
    );

    vec3 sh = normalize(v + sr);
    float nDotLSky = saturate(dot(n, sr));
    float nDotVSky = clamp(dot(n, v), 1e-4, 1.0);
    float nDotHSky = saturate(dot(n, sh));
    float vDotHSky = saturate(dot(v, sh));
    float skyRgh = max(rgh, 0.28);
    float dSky = ggxIsotropicD(nDotHSky, skyRgh);
    float gSky = smithGgxG(nDotVSky, nDotLSky, skyRgh);
    vec3 fSky = vec3(
      schlickFresnelScalar(vDotHSky, f0.r),
      schlickFresnelScalar(vDotHSky, f0.g),
      schlickFresnelScalar(vDotHSky, f0.b)
    );
    float specSkyBase = 0.42 * dSky * gSky * nDotLSky;
    float diffSkyScale = (1.0 - met) * nDotLSky;
    vec3 sky = ((vec3(1.0) - fSky) * diffSkyScale * alb + specSkyBase * fSky) * skyIrr;

    vec3 tf = vec3((0.15 + 0.5 * u_tableParams.x) - p.x, -p.y, 2.85 - p.z);
    float distFlPatch = sqrt(max(dot(tf, tf), 0.12));
    vec3 df = tf / distFlPatch;
    float cosFlRec = saturate(dot(n, df));
    float cosFlEmit = saturate(-df.y);
    float formFlBounce = (cosFlRec * cosFlEmit) / (1.4 + 0.16 * distFlPatch * distFlPatch);
    float hemiBounce = 0.35 + 0.65 * saturate(0.5 - 0.5 * n.y);
    float flW = formFlBounce * 1.45 + hemiBounce * 0.28;

    float distWalnut = max(p.x - (-2.75 + u_leftWallShiftX), 0.35);
    float cosWalRec = saturate(-n.x * 0.75 + 0.25);
    float walW = cosWalRec / (1.2 + 0.28 * distWalnut * distWalnut);

    float indScale = ao * INV_PI;
    vec3 ind = alb * vec3(
      flW * (1.52 + 0.24 * u_duskFactor) + walW * 0.62 + 0.24,
      flW * (0.96 - 0.04 * u_duskFactor) + walW * 0.32 + 0.22,
      flW * (0.52 - 0.10 * u_duskFactor) + walW * 0.15 + 0.20
    ) * indScale;

    float credDx = u_benchParams.x + 0.85;
    float bScaleX = u_benchParams.y / 1.70;
    float duskBoost = 1.0 + 1.15 * u_duskFactor;

    vec3 sc = evalSconceLight(
      p, n, v, nDotVSky, alb, rgh, f0, met,
      u_sconcePos, u_sconceRadiance,
      0.28, 1.15 - 0.32 * u_duskFactor, -0.65, 0.35 + 0.20 * u_duskFactor
    );

    float picCenterX = -1.58 * bScaleX + credDx;
    float picClampedX = clamp(p.x, picCenterX - 0.21 * bScaleX, picCenterX + 0.21 * bScaleX);
    vec3 toPic = vec3(picClampedX - p.x, 1.918 - p.y, 7.00 - p.z);
    float distPic2 = max(dot(toPic, toPic), 0.025);
    float distPic = sqrt(distPic2);
    vec3 dirPic = toPic / distPic;
    float belowPic = 1.0 - smoothstepCpu(1.895, 1.932, p.y);
    float latPic = abs(p.x - picCenterX);
    float horizWash = 1.0 - smoothstepCpu(0.34, 0.92, latPic);
    float conePic = (
      smoothstepCpu(0.06, 0.58, dirPic.y) * belowPic * (0.28 + 0.72 * horizWash)
      + 0.03 * smoothstepCpu(-0.40, 0.12, dirPic.y) * (1.0 - belowPic) * horizWash
    );
    float wPic = conePic / (0.18 + 1.05 * distPic2);
    if (wPic > 1e-5) {
      vec3 hPic = normalize(v + dirPic);
      float nDotLPic = saturate(dot(n, dirPic));
      float nDotHPic = saturate(dot(n, hPic));
      float vDotHPic = saturate(dot(v, hPic));
      float dPic = ggxIsotropicD(nDotHPic, rgh);
      float gPic = smithGgxG(nDotVSky, nDotLPic, rgh);
      vec3 fPic = vec3(
        schlickFresnelScalar(vDotHPic, f0.r),
        schlickFresnelScalar(vDotHPic, f0.g),
        schlickFresnelScalar(vDotHPic, f0.b)
      );
      vec3 picRad = vec3(10.40, 6.85, 3.12) * duskBoost;
      sc += ((vec3(1.0) - fPic) * ((1.0 - met) * INV_PI * nDotLPic) * alb + (dPic * gPic * nDotLPic) * fPic) * picRad * wPic;
    }

    vec3 toDl = vec3(0.25 * bScaleX + credDx - p.x, 1.842 - p.y, 7.06 - p.z);
    float distDl2 = max(dot(toDl, toDl), 0.025);
    float distDl = sqrt(distDl2);
    vec3 dirDl = toDl / distDl;
    float belowDl = 1.0 - smoothstepCpu(1.815, 1.852, p.y);
    float coneDl = (
      smoothstepCpu(0.28, 0.78, dirDl.y) * belowDl
      + 0.03 * smoothstepCpu(-0.40, 0.12, dirDl.y) * (1.0 - belowDl)
    );
    float wDl = coneDl / (0.20 + 1.25 * distDl2);
    if (wDl > 1e-5) {
      vec3 hDl = normalize(v + dirDl);
      float nDotLDl = saturate(dot(n, dirDl));
      float nDotHDl = saturate(dot(n, hDl));
      float vDotHDl = saturate(dot(v, hDl));
      float dDl = ggxIsotropicD(nDotHDl, rgh);
      float gDl = smithGgxG(nDotVSky, nDotLDl, rgh);
      vec3 fDl = vec3(
        schlickFresnelScalar(vDotHDl, f0.r),
        schlickFresnelScalar(vDotHDl, f0.g),
        schlickFresnelScalar(vDotHDl, f0.b)
      );
      vec3 dlRad = vec3(8.40, 5.48, 2.48) * duskBoost;
      sc += ((vec3(1.0) - fDl) * ((1.0 - met) * INV_PI * nDotLDl) * alb + (dDl * gDl * nDotLDl) * fDl) * dlRad * wDl;
    }

    if (p.x < -2.745 + u_leftWallShiftX) {
      float shelfGrazing = max(0.0, (-2.745 + u_leftWallShiftX - p.x) / 0.38);
      sc += alb * vec3(0.28, 0.19, 0.11) * shelfGrazing;
    }

    return direct + caust + sky + ind + sc;
  }

  vec3 computeCameraRayDir(float xPx, float yPx) {
    float aspectInv = u_res.y / u_res.x;
    float uu = -1.0 + (2.0 * xPx) / max(u_res.x - 1.0, 1.0);
    float vv = aspectInv - (2.0 * aspectInv * yPx) / max(u_res.y - 1.0, 1.0) + u_camVShift;
    float uScaled = uu * u_camFovScale;
    float vScaled = vv * u_camFovScale;
    float snYaw = sin(u_camYawRad), csYaw = cos(u_camYawRad);
    vec3 fwd = vec3(snYaw, 0.0, csYaw);
    vec3 right = vec3(csYaw, 0.0, -snYaw);
    vec3 up = vec3(0.0, 1.0, 0.0);
    return normalize(fwd + uScaled * right + vScaled * up);
  }
